<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7ed" />
    <meta name="description" content="Um puzzle especial de aniversário para a Inês." />
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png" />
    <title>Parabéns, Inês! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap");

      :root {
        --ink: #402c35;
        --muted: #856d76;
        --berry: #b7355d;
        --berry-dark: #922543;
        --peach: #ff8d78;
        --gold: #f6bc4b;
        --cream: #fffaf1;
        --paper: rgba(255, 255, 255, 0.84);
        --tile-gap: clamp(3px, 1vw, 6px);
        --shadow: 0 24px 70px rgba(108, 50, 65, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #f8d9ce;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.95) 0 5%, transparent 20%),
          radial-gradient(circle at 92% 18%, rgba(246, 188, 75, 0.24) 0 8%, transparent 27%),
          linear-gradient(155deg, #fff9ef 0%, #ffe3d8 49%, #f7c9ca 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      .page-shell::before,
      .page-shell::after {
        position: fixed;
        z-index: -1;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(183, 53, 93, 0.12);
        border-radius: 50%;
        content: "";
      }

      .page-shell::before {
        top: -115px;
        left: -92px;
        box-shadow: 0 0 0 34px rgba(255, 141, 120, 0.06), 0 0 0 68px rgba(255, 141, 120, 0.04);
      }

      .page-shell::after {
        right: -130px;
        bottom: -100px;
        box-shadow: 0 0 0 40px rgba(246, 188, 75, 0.08), 0 0 0 80px rgba(246, 188, 75, 0.04);
      }

      .confetti-piece {
        position: fixed;
        z-index: -1;
        width: 8px;
        height: 18px;
        border-radius: 6px;
        opacity: 0.5;
        transform: rotate(var(--rotate));
      }

      .confetti-piece:nth-child(1) { top: 8%; left: 7%; background: var(--berry); --rotate: 25deg; }
      .confetti-piece:nth-child(2) { top: 19%; right: 8%; width: 11px; height: 11px; background: var(--gold); --rotate: 45deg; }
      .confetti-piece:nth-child(3) { top: 52%; left: 4%; background: var(--peach); --rotate: -25deg; }
      .confetti-piece:nth-child(4) { right: 5%; bottom: 18%; background: var(--berry); --rotate: 65deg; }

      main {
        width: min(100%, 470px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 0 0 8px;
        color: var(--berry);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.45;
      }

      h1 {
        max-width: 390px;
        margin: 0 auto 20px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.35rem, 11vw, 4.2rem);
        line-height: 0.94;
        text-align: center;
        letter-spacing: -0.045em;
      }

      h1 em {
        color: var(--berry);
        font-weight: 700;
      }

      .game-card {
        padding: clamp(12px, 3.5vw, 18px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 30px;
        background: var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin: 2px 3px 13px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .stat:last-child {
        justify-content: flex-end;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .stat-value {
        min-width: 1.6ch;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.35rem;
        font-variant-numeric: tabular-nums;
      }

      .level-badge {
        padding: 7px 11px;
        border-radius: 999px;
        color: var(--berry-dark);
        background: rgba(183, 53, 93, 0.09);
        font-size: 0.7rem;
        font-weight: 700;
      }

      .puzzle-wrap {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        padding: var(--tile-gap);
        border-radius: 22px;
        background: #e6c6bd;
        box-shadow: inset 0 0 0 1px rgba(64, 44, 53, 0.09);
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .puzzle {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .tile {
        position: absolute;
        width: calc((100% - (var(--tile-gap) * 2)) / 3);
        height: calc((100% - (var(--tile-gap) * 2)) / 3);
        padding: 0;
        border: 0;
        border-radius: clamp(8px, 2.6vw, 14px);
        background-image: url("./assets/Ines.jpg");
        background-repeat: no-repeat;
        background-size: 300% 300%;
        box-shadow: 0 4px 10px rgba(62, 37, 46, 0.2);
        cursor: pointer;
        transition: transform 190ms cubic-bezier(0.22, 0.75, 0.35, 1), box-shadow 160ms ease, opacity 220ms ease;
        will-change: transform;
      }

      .tile:hover {
        box-shadow: 0 7px 16px rgba(62, 37, 46, 0.28);
      }

      .tile:focus-visible,
      .control-button:focus-visible,
      .icon-button:focus-visible,
      .celebration-button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }

      .tile.is-final {
        cursor: default;
      }

      .tile.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .puzzle.solved .tile {
        border-radius: 0;
        box-shadow: none;
      }

      .blank-mark {
        position: absolute;
        display: grid;
        width: calc((100% - (var(--tile-gap) * 2)) / 3);
        height: calc((100% - (var(--tile-gap) * 2)) / 3);
        place-items: center;
        color: rgba(146, 37, 67, 0.26);
        font-size: clamp(1.6rem, 8vw, 2.7rem);
        pointer-events: none;
        transition: transform 190ms cubic-bezier(0.22, 0.75, 0.35, 1), opacity 220ms ease;
      }

      .puzzle.solved .blank-mark {
        opacity: 0;
      }

      .puzzle-preview {
        position: absolute;
        inset: 0;
        z-index: 4;
        border-radius: 18px;
        background: url("./assets/Ines.jpg") center / cover no-repeat;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        opacity: 0;
        pointer-events: none;
        transform: scale(1.025);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .puzzle-preview.visible {
        opacity: 1;
        transform: scale(1);
      }

      .controls {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 10px;
        margin-top: 13px;
      }

      .control-button,
      .celebration-button {
        min-height: 50px;
        border: 0;
        border-radius: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 130ms ease, box-shadow 130ms ease, background 130ms ease;
      }

      .control-button:active,
      .celebration-button:active {
        transform: translateY(2px);
      }

      .control-button.primary,
      .celebration-button {
        color: white;
        background: var(--berry);
        box-shadow: 0 8px 18px rgba(183, 53, 93, 0.22);
      }

      .control-button.primary:hover,
      .celebration-button:hover {
        background: var(--berry-dark);
      }

      .control-button.secondary {
        color: var(--ink);
        background: #f4eae4;
      }

      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 13px 0 1px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
      }

      .hint-icon {
        display: grid;
        width: 19px;
        height: 19px;
        place-items: center;
        border: 1px solid rgba(133, 109, 118, 0.34);
        border-radius: 50%;
        font-size: 0.68rem;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(56, 31, 42, 0.48);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
        backdrop-filter: blur(9px);
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 390px);
        padding: 30px 24px 24px;
        overflow: hidden;
        border-radius: 30px;
        background: var(--cream);
        box-shadow: 0 28px 80px rgba(47, 23, 34, 0.32);
        text-align: center;
        transform: translateY(18px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card {
        transform: translateY(0) scale(1);
      }

      .celebration-emoji {
        display: block;
        margin-bottom: 8px;
        font-size: 2.5rem;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .celebration h2 {
        margin: 0;
        color: var(--berry);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 10vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .celebration p {
        margin: 14px auto 20px;
        color: var(--muted);
        line-height: 1.55;
      }

      .celebration-button {
        width: 100%;
      }

      .burst {
        position: absolute;
        width: 10px;
        height: 26px;
        border-radius: 10px;
        animation: rain 1.8s ease-in infinite;
      }

      .burst:nth-child(1) { top: -28px; left: 10%; background: var(--berry); animation-delay: -0.3s; }
      .burst:nth-child(2) { top: -28px; left: 29%; background: var(--gold); animation-delay: -1.1s; }
      .burst:nth-child(3) { top: -28px; left: 51%; background: var(--peach); animation-delay: -0.7s; }
      .burst:nth-child(4) { top: -28px; right: 26%; background: #67a99a; animation-delay: -1.5s; }
      .burst:nth-child(5) { top: -28px; right: 8%; background: var(--berry); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes bounce {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-6px); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(390px) rotate(260deg); }
      }

      @media (max-height: 720px) and (orientation: portrait) {
        .page-shell { padding-top: 12px; padding-bottom: 14px; }
        .eyebrow { margin-bottom: 5px; }
        h1 { margin-bottom: 11px; font-size: 2.2rem; }
        .game-card { padding: 11px; border-radius: 24px; }
        .scoreboard { margin-bottom: 8px; }
        .controls { margin-top: 9px; }
        .control-button { min-height: 44px; }
        .hint { margin-top: 8px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 38px; }
        h1 { margin-bottom: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>

      <main>
        <p class="eyebrow">Um dia muito especial</p>
        <h1>Parabéns, <em>Inês!</em></h1>

        <section class="game-card" aria-label="Puzzle de aniversário">
          <div class="scoreboard" aria-live="polite">
            <div class="stat">
              <span class="stat-label">Jogadas</span>
              <span class="stat-value" id="moveCount">0</span>
            </div>
            <span class="level-badge">Puzzle 3 × 3</span>
            <div class="stat">
              <span class="stat-label">Tempo</span>
              <span class="stat-value" id="timer">0:00</span>
            </div>
          </div>

          <div class="puzzle-wrap" id="puzzleWrap">
            <div class="puzzle" id="puzzle" role="group" aria-label="Puzzle deslizante 3 por 3"></div>
            <div class="puzzle-preview" id="preview" aria-hidden="true"></div>
          </div>

          <div class="controls">
            <button class="control-button primary" id="shuffleButton" type="button">Misturar peças</button>
            <button class="control-button secondary" id="previewButton" type="button" aria-pressed="false">Ver fotografia</button>
          </div>
          <p class="hint"><span class="hint-icon" aria-hidden="true">↔</span>Toca ou desliza uma peça para o espaço vazio.</p>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <span class="celebration-emoji" aria-hidden="true">🎂</span>
        <h2 id="celebrationTitle">Conseguiste!</h2>
        <p id="celebrationText">Muitos parabéns, Inês! Que este novo ano seja cheio de sorrisos, aventuras e momentos inesquecíveis.</p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const SIZE = 3;
        const EMPTY = SIZE * SIZE - 1;
        const SHUFFLE_STEPS = 140;
        const puzzle = document.querySelector("#puzzle");
        const puzzleWrap = document.querySelector("#puzzleWrap");
        const moveCount = document.querySelector("#moveCount");
        const timer = document.querySelector("#timer");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const previewButton = document.querySelector("#previewButton");
        const shuffleButton = document.querySelector("#shuffleButton");
        const celebration = document.querySelector("#celebration");
        const celebrationText = document.querySelector("#celebrationText");
        const playAgainButton = document.querySelector("#playAgainButton");

        let board = Array.from({ length: SIZE * SIZE }, (_, index) => index);
        let moves = 0;
        let seconds = 0;
        let timerId = null;
        let gameStarted = false;
        let solved = false;
        let pointerStart = null;
        const tiles = new Map();

        const row = (position) => Math.floor(position / SIZE);
        const column = (position) => position % SIZE;
        const areAdjacent = (a, b) => Math.abs(row(a) - row(b)) + Math.abs(column(a) - column(b)) === 1;
        const isSolved = () => board.every((tile, position) => tile === position);

        function formatTime(value) {
          const minutes = Math.floor(value / 60);
          return `${minutes}:${String(value % 60).padStart(2, "0")}`;
        }

        function tileTransform(position) {
          return `translate(calc(${column(position) * 100}% + ${column(position)} * var(--tile-gap)), calc(${row(position) * 100}% + ${row(position)} * var(--tile-gap)))`;
        }

        function updateStats() {
          moveCount.textContent = String(moves);
          timer.textContent = formatTime(seconds);
        }

        function startTimer() {
          if (timerId || solved) return;
          timerId = window.setInterval(() => {
            seconds += 1;
            updateStats();
          }, 1000);
        }

        function stopTimer() {
          window.clearInterval(timerId);
          timerId = null;
        }

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        function renderBoard(animate = true) {
          puzzle.classList.toggle("solved", solved);

          board.forEach((tileNumber, position) => {
            const element = tiles.get(tileNumber);
            element.style.transitionDuration = animate ? "" : "0ms";
            element.style.transform = tileTransform(position);
            element.dataset.position = String(position);
            element.tabIndex = tileNumber === EMPTY ? -1 : 0;
            element.setAttribute("aria-label", tileNumber === EMPTY ? "Espaço vazio" : `Peça ${tileNumber + 1}`);
            element.classList.toggle("is-hidden", tileNumber === EMPTY && !solved);
            element.classList.toggle("is-final", solved);
          });
        }

        function legalPositions(emptyPosition) {
          return board.map((_, position) => position).filter((position) => areAdjacent(position, emptyPosition));
        }

        function swapPositions(first, second) {
          [board[first], board[second]] = [board[second], board[first]];
        }

        function shuffle() {
          hideCelebration();
          stopTimer();
          gameStarted = false;
          solved = false;
          moves = 0;
          seconds = 0;
          board = Array.from({ length: SIZE * SIZE }, (_, index) => index);
          let previousEmpty = -1;

          for (let step = 0; step < SHUFFLE_STEPS; step += 1) {
            const emptyPosition = board.indexOf(EMPTY);
            let choices = legalPositions(emptyPosition).filter((position) => position !== previousEmpty);
            if (!choices.length) choices = legalPositions(emptyPosition);
            const chosen = choices[Math.floor(Math.random() * choices.length)];
            previousEmpty = emptyPosition;
            swapPositions(emptyPosition, chosen);
          }

          if (isSolved()) {
            const emptyPosition = board.indexOf(EMPTY);
            swapPositions(emptyPosition, legalPositions(emptyPosition)[0]);
          }

          updateStats();
          renderBoard(false);
          requestAnimationFrame(() => requestAnimationFrame(() => {
            tiles.forEach((element) => { element.style.transitionDuration = ""; });
          }));
          announce("As peças foram misturadas. Boa sorte!");
        }

        function moveTile(position) {
          if (solved) return false;
          const emptyPosition = board.indexOf(EMPTY);
          if (!areAdjacent(position, emptyPosition)) {
            announce("Essa peça não está junto ao espaço vazio.");
            return false;
          }

          if (!gameStarted) {
            gameStarted = true;
            startTimer();
          }

          swapPositions(position, emptyPosition);
          moves += 1;
          updateStats();
          renderBoard();

          if (isSolved()) completeGame();
          else announce(`Jogada ${moves}.`);
          return true;
        }

        function completeGame() {
          solved = true;
          stopTimer();
          renderBoard();
          celebrationText.textContent = `Completaste o puzzle em ${moves} ${moves === 1 ? "jogada" : "jogadas"} e ${formatTime(seconds)}. Muitos parabéns, Inês! Que este novo ano seja cheio de sorrisos, aventuras e momentos inesquecíveis.`;
          announce("Puzzle completo. Parabéns!");
          window.setTimeout(showCelebration, 650);
          playChime();
        }

        function showCelebration() {
          celebration.classList.add("visible");
          celebration.setAttribute("aria-hidden", "false");
          playAgainButton.focus();
        }

        function hideCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        function setPreview(visible) {
          preview.classList.toggle("visible", visible);
          previewButton.setAttribute("aria-pressed", String(visible));
          previewButton.textContent = visible ? "Voltar ao puzzle" : "Ver fotografia";
        }

        function playChime() {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audio = new AudioContext();
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((frequency, index) => {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, audio.currentTime + index * 0.12);
              gain.gain.linearRampToValueAtTime(0.12, audio.currentTime + index * 0.12 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + index * 0.12 + 0.4);
              oscillator.connect(gain).connect(audio.destination);
              oscillator.start(audio.currentTime + index * 0.12);
              oscillator.stop(audio.currentTime + index * 0.12 + 0.42);
            });
            window.setTimeout(() => audio.close(), 900);
          } catch (_) {
            // Audio is a small bonus; the game remains fully playable without it.
          }
        }

        function createTiles() {
          for (let tileNumber = 0; tileNumber <= EMPTY; tileNumber += 1) {
            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile";
            tile.style.backgroundPosition = `${column(tileNumber) * 50}% ${row(tileNumber) * 50}%`;
            tile.addEventListener("click", () => {
              const position = board.indexOf(tileNumber);
              moveTile(position);
            });
            tiles.set(tileNumber, tile);
            puzzle.appendChild(tile);
          }

          const blankMark = document.createElement("span");
          blankMark.className = "blank-mark";
          blankMark.setAttribute("aria-hidden", "true");
          blankMark.textContent = "✦";
          tiles.set(EMPTY, tiles.get(EMPTY));
          puzzle.appendChild(blankMark);

          const originalRender = renderBoard;
          renderBoard = function renderBoardWithBlank(animate = true) {
            originalRender(animate);
            const emptyPosition = board.indexOf(EMPTY);
            blankMark.style.transitionDuration = animate ? "" : "0ms";
            blankMark.style.transform = tileTransform(emptyPosition);
          };
        }

        puzzle.addEventListener("keydown", (event) => {
          if (!event.key.startsWith("Arrow")) return;
          event.preventDefault();
          const emptyPosition = board.indexOf(EMPTY);
          const offsets = { ArrowUp: SIZE, ArrowDown: -SIZE, ArrowLeft: 1, ArrowRight: -1 };
          const candidate = emptyPosition + offsets[event.key];
          if (candidate >= 0 && candidate < board.length && areAdjacent(candidate, emptyPosition)) moveTile(candidate);
        });

        puzzleWrap.addEventListener("pointerdown", (event) => {
          pointerStart = { x: event.clientX, y: event.clientY };
        });

        puzzleWrap.addEventListener("pointerup", (event) => {
          if (!pointerStart || solved) return;
          const dx = event.clientX - pointerStart.x;
          const dy = event.clientY - pointerStart.y;
          pointerStart = null;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;

          const emptyPosition = board.indexOf(EMPTY);
          let candidate = -1;
          if (Math.abs(dx) > Math.abs(dy)) candidate = emptyPosition + (dx > 0 ? -1 : 1);
          else candidate = emptyPosition + (dy > 0 ? -SIZE : SIZE);
          if (candidate >= 0 && candidate < board.length && areAdjacent(candidate, emptyPosition)) moveTile(candidate);
        });

        puzzleWrap.addEventListener("pointercancel", () => { pointerStart = null; });
        shuffleButton.addEventListener("click", shuffle);
        previewButton.addEventListener("click", () => setPreview(!preview.classList.contains("visible")));
        playAgainButton.addEventListener("click", () => {
          shuffle();
          shuffleButton.focus();
        });
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) hideCelebration();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setPreview(false);
            hideCelebration();
          }
        });

        createTiles();
        shuffle();
      })();
    </script>
  </body>
</html>
