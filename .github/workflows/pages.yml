name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez. Não se cancela a que está a meio: cancelar uma
# publicação já entregue ao GitHub Pages deixa-a pendurada e a seguinte espera por ela.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o site
        uses: actions/checkout@v6
      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar as dependências
        run: npm ci
      - name: Correr os testes de todos os puzzles
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter o site
        uses: actions/checkout@v6
      # As três acções do Pages têm de andar a par: o artefacto que a v5 grava
      # só é entregue por uma versão de deploy-pages que o saiba ir buscar.
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6
      - name: Reunir as páginas
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets puzzles _site/
          find _site -name '*.test.js' -delete
      - name: Preparar os ficheiros
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # O GitHub Pages tem andado a levar mais de 10 minutos a aceitar a
          # publicação — que é quanto a acção espera por omissão. Damos-lhe 30.
          timeout: 1800000
