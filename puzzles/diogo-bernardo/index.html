    <title>Parabéns, Diogo e Bernardo! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;600;700&display=swap");

      /*
       * As cores são as da banda desenhada de super-heróis: o vermelho e o azul
       * dos fatos, o amarelo dos balões de fala, e o papel envelhecido por baixo
       * de tudo. O tabuleiro é o único sítio escuro da página — é lá que a
       * fotografia está escondida.
       */
      :root {
        --ink: #14121c;
        --paper: #fdf6e6;
        --red: #e62429;
        --red-dark: #a8161b;
        --blue: #1f3f9e;
        --blue-dark: #14286b;
        --yellow: #ffcf2e;
        --cyan: #2ec4d9;
        --pink: #ff7bb0;
        --orange: #ff8a2b;
        --muted: #6d6577;
        --board: #07060f;
        --wall: #2340c4;
        --panel-shadow: 7px 7px 0 var(--ink);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #f2e4c7;
      }

      /* O papel: pontinhos de trama por cima de um degradé quente. */
      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(circle at 50% 50%, rgba(230, 36, 41, 0.18) 0 1.1px, transparent 1.6px) 0 0 / 9px 9px,
          radial-gradient(circle at 50% 50%, rgba(31, 63, 158, 0.14) 0 1.1px, transparent 1.6px) 4.5px 4.5px / 9px 9px,
          linear-gradient(155deg, #fffaf0 0%, #fdf0d6 52%, #f6dcc0 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      /* O clarão de raios que a banda desenhada põe atrás do herói. */
      .page-shell::before {
        position: fixed;
        z-index: -1;
        top: 50%;
        left: 50%;
        width: 190vmax;
        height: 190vmax;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(230, 36, 41, 0.07) 0deg 7deg,
          transparent 7deg 14deg
        );
        content: "";
        transform: translate(-50%, -50%);
      }

      main {
        width: min(100%, 470px);
      }

      /* A tarja da capa: bloco vermelho à esquerda, número da revista à direita. */
      .cover-bar {
        display: flex;
        align-items: stretch;
        gap: 6px;
        margin-bottom: 8px;
      }

      .cover-logo {
        padding: 5px 12px 3px;
        border: 2px solid var(--ink);
        color: var(--paper);
        background: var(--red);
        box-shadow: 3px 3px 0 var(--ink);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: 1.12rem;
        letter-spacing: 0.13em;
        line-height: 1.25;
      }

      .cover-issue {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        color: var(--muted);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        color: var(--yellow);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: clamp(1.95rem, 9.4vw, 3.2rem);
        font-weight: 400;
        line-height: 0.9;
        text-align: center;
        letter-spacing: 0.015em;
        text-shadow: 4px 4px 0 var(--red), 7px 7px 0 var(--ink);
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
      }

      h1 em {
        display: block;
        color: var(--paper);
        font-style: normal;
        text-shadow: 4px 4px 0 var(--blue), 7px 7px 0 var(--ink);
      }

      /* O cartão do jogo é uma vinheta: contorno grosso e sombra dura. */
      .game-card {
        padding: clamp(10px, 3vw, 15px);
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: var(--paper);
        box-shadow: var(--panel-shadow);
      }

      .scoreboard {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 1px 8px;
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .stat-value {
        display: block;
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: 1.5rem;
        line-height: 1;
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
      }

      .lives {
        display: flex;
        gap: 5px;
        min-height: 18px;
        margin-top: 3px;
      }

      /* Cada vida é um herói de reserva, desenhado como a boca do jogo. */
      .life {
        width: 15px;
        height: 15px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--yellow);
        clip-path: polygon(100% 24%, 52% 50%, 100% 76%, 100% 100%, 0 100%, 0 0, 100% 0);
      }

      .hero-tag {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px 4px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        color: var(--paper);
        background: var(--red);
        box-shadow: 2px 2px 0 var(--ink);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        white-space: nowrap;
        transition: background 200ms ease;
      }

      .hero-tag[data-hero="1"] {
        background: var(--blue);
      }

      .hero-tag::before {
        width: 13px;
        height: 13px;
        flex: 0 0 auto;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--yellow);
        content: "";
        clip-path: polygon(100% 24%, 52% 50%, 100% 76%, 100% 100%, 0 100%, 0 0, 100% 0);
      }

      /*
       * O tabuleiro tem a forma da fotografia: 12 × 18 casas é 2 : 3, tal como
       * ela, por isso cada casa mostra o seu pedaço sem esticar nada.
       */
      .maze {
        position: relative;
        display: grid;
        width: min(100%, 36svh, 400px);
        margin: 0 auto;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 4px;
        background: var(--board);
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(18, 1fr);
        aspect-ratio: 12 / 18;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Cada casa é uma janela para o seu bocado da fotografia. */
      .cell {
        position: relative;
        background-repeat: no-repeat;
        background-size: 1200% 1800%;
      }

      /* Por cima da janela está a tinta: é ela que esconde a fotografia. */
      .cell::before {
        position: absolute;
        inset: 0;
        background: var(--board);
        content: "";
        transition: opacity 420ms ease;
      }

      /* Pastilha comida: a tinta levanta-se e fica a fotografia. */
      .cell[data-shown="1"]::before {
        opacity: 0;
      }

      .cell::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20%;
        border-radius: 50%;
        aspect-ratio: 1;
        background: var(--yellow);
        box-shadow: 0 0 5px rgba(255, 207, 46, 0.75);
        content: "";
        opacity: 0;
        transition: opacity 420ms ease;
        transform: translate(-50%, -50%);
      }

      .cell[data-dot="dot"]::after {
        opacity: 1;
      }

      /* O poder é a pastilha grande: é ela que troca de herói. */
      .cell[data-dot="power"]::after {
        width: 58%;
        background: radial-gradient(circle at 36% 32%, #fff2b8, var(--red) 72%);
        box-shadow: 0 0 12px rgba(230, 36, 41, 0.8);
        opacity: 1;
        animation: pulse 780ms ease-in-out infinite;
      }

      /*
       * A parede e a porta do covil são blocos por cima da casa, e não a casa
       * em si: assim a janela da fotografia continua quadrada por baixo, e no
       * fim não fica nenhum canto por destapar.
       */
      .cell[data-kind="wall"]::after,
      .cell[data-kind="door"]::after {
        inset: 0;
        width: auto;
        border-radius: var(--corners, 0);
        aspect-ratio: auto;
        opacity: 1;
        transform: none;
      }

      .cell[data-kind="wall"]::after {
        background: linear-gradient(160deg, #3457e8, #172f96);
        box-shadow: inset 0 0 0 2px rgba(120, 160, 255, 0.55), inset 0 0 9px rgba(0, 0, 0, 0.45);
      }

      .cell[data-kind="door"]::after {
        background: var(--pink);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
        transform: scaleY(0.34);
      }

      /* No fim cai tudo — paredes incluídas — e a fotografia fica inteira. */
      .maze.solved .cell::before,
      .maze.solved .cell::after {
        opacity: 0;
      }

      .actors {
        position: absolute;
        z-index: 3;
        inset: 0;
        pointer-events: none;
        transition: opacity 400ms ease;
      }

      /* Acabado o jogo, saem todos de cena e deixam a fotografia à vista. */
      .maze.solved .actors {
        opacity: 0;
      }

      .actor {
        position: absolute;
        width: calc(100% / 12);
        aspect-ratio: 1;
        transition: left 150ms linear, top 150ms linear;
        will-change: left, top;
      }

      .actor[data-jump="1"] {
        transition: none;
      }

      /*
       * O herói é a boca de sempre: um círculo com uma fatia de fora, virado
       * para o lado onde anda. A cor é a do herói que está ao serviço.
       */
      .hero {
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.9) 0 7%, var(--hero-color, var(--red)) 25%);
        animation: chomp 320ms ease-in-out infinite;
        transform: rotate(var(--rot, 90deg));
        transform-origin: 50% 50%;
      }

      .maze[data-state="ready"] .hero,
      .maze[data-state="paused"] .hero,
      .maze[data-state="over"] .hero,
      .maze.solved .hero {
        animation: none;
        clip-path: polygon(100% 24%, 52% 50%, 100% 76%, 100% 100%, 0 100%, 0 0, 100% 0);
      }

      /* O vilão: cabeça redonda, capa aos picos, e dois olhos a espreitar. */
      .ghost {
        border-radius: 50% 50% 14% 14% / 62% 62% 22% 22%;
        background: var(--ghost-color, var(--red));
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.55);
        clip-path: polygon(
          0% 0%, 100% 0%, 100% 100%, 84% 84%, 67% 100%, 50% 84%, 33% 100%, 16% 84%, 0% 100%
        );
      }

      .ghost::before,
      .ghost::after {
        position: absolute;
        top: 30%;
        width: 26%;
        height: 30%;
        border-radius: 50%;
        background: #fff;
        box-shadow: inset -2px 0 0 var(--ink);
        content: "";
      }

      .ghost::before { left: 14%; }
      .ghost::after { right: 14%; }

      /* Com um poder no ar, os vilões fogem: ficam azuis e de olhos em pânico. */
      .ghost[data-mode="fright"] {
        background: #2b3ad6;
        animation: blink 420ms steps(1) infinite;
      }

      .ghost[data-mode="fright"]::before,
      .ghost[data-mode="fright"]::after {
        box-shadow: inset 0 0 0 2px var(--ink);
      }

      /* Apanhado: sobram-lhe os olhos, a caminho do covil. */
      .ghost[data-mode="back"] {
        background: transparent;
        box-shadow: none;
        clip-path: none;
      }

      .ghost[data-mode="home"] {
        opacity: 0.85;
      }

      /* O balão de estrela: aparece em cima do tabuleiro a cada poder. */
      .burst {
        position: absolute;
        z-index: 4;
        top: 50%;
        left: 50%;
        display: grid;
        width: 62%;
        place-items: center;
        aspect-ratio: 1;
        color: var(--ink);
        background: var(--yellow);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: clamp(1.5rem, 8vw, 2.3rem);
        letter-spacing: 0.05em;
        opacity: 0;
        pointer-events: none;
        clip-path: polygon(
          50% 0%, 61% 22%, 86% 14%, 79% 39%, 100% 50%, 79% 61%, 86% 86%, 61% 78%,
          50% 100%, 39% 78%, 14% 86%, 21% 61%, 0% 50%, 21% 39%, 14% 14%, 39% 22%
        );
        transform: translate(-50%, -50%) scale(0.4) rotate(-8deg);
      }

      .burst.visible {
        animation: pop 900ms ease-out;
      }

      .board-note {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(7, 6, 15, 0.72);
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }

      .board-note.visible {
        opacity: 1;
      }

      .board-note span {
        padding: 9px 16px 6px;
        border: 3px solid var(--ink);
        border-radius: 4px;
        color: var(--ink);
        background: var(--yellow);
        box-shadow: 4px 4px 0 var(--ink);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: clamp(1.2rem, 6vw, 1.8rem);
        letter-spacing: 0.06em;
        text-align: center;
      }

      .puzzle-preview {
        position: absolute;
        z-index: 6;
        inset: 0;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .puzzle-preview.visible {
        opacity: 1;
      }

      /* Os vilões da capa: quem são e de que cor andam. */
      .villains {
        display: grid;
        gap: 4px;
        margin-top: 8px;
        grid-template-columns: repeat(4, 1fr);
      }

      .villain {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        overflow: hidden;
        border: 2px solid var(--ink);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.6);
        font-size: 0.5rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-transform: uppercase;
      }

      .villain::before {
        width: 10px;
        height: 12px;
        flex: 0 0 auto;
        border-radius: 50% 50% 12% 12% / 62% 62% 20% 20%;
        background: var(--ghost-color);
        content: "";
      }

      /* As setas à esquerda, os botões à direita: cabe tudo na mesma linha. */
      .deck {
        display: grid;
        align-items: center;
        margin-top: 9px;
        gap: 9px;
        grid-template-columns: auto 1fr;
      }

      .pad {
        display: grid;
        gap: 5px;
        grid-template-areas: ". up ." "left down right";
        grid-template-columns: repeat(3, 46px);
      }

      .pad-button {
        display: grid;
        min-height: 43px;
        place-items: center;
        border: 3px solid var(--ink);
        border-radius: 6px;
        color: var(--ink);
        background: var(--yellow);
        box-shadow: 3px 3px 0 var(--ink);
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 90ms ease, box-shadow 90ms ease;
      }

      .pad-button:active {
        box-shadow: 0 0 0 var(--ink);
        transform: translate(3px, 3px);
      }

      .pad-button[data-dir="up"] { grid-area: up; }
      .pad-button[data-dir="left"] { grid-area: left; }
      .pad-button[data-dir="down"] { grid-area: down; }
      .pad-button[data-dir="right"] { grid-area: right; }

      .controls {
        display: grid;
        gap: 5px;
      }

      .control-button,
      .celebration-button {
        min-height: 43px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        box-shadow: 4px 4px 0 var(--ink);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: 1.05rem;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: transform 90ms ease, box-shadow 90ms ease;
      }

      .control-button:active,
      .celebration-button:active {
        box-shadow: 0 0 0 var(--ink);
        transform: translate(4px, 4px);
      }

      .control-button.primary,
      .celebration-button {
        color: var(--paper);
        background: var(--red);
      }

      .control-button.secondary {
        color: var(--ink);
        background: var(--paper);
      }

      .control-button[disabled],
      .pad-button[disabled] {
        box-shadow: 2px 2px 0 rgba(20, 18, 28, 0.35);
        opacity: 0.45;
        cursor: default;
      }

      .pad-button:focus-visible,
      .control-button:focus-visible,
      .celebration-button:focus-visible,
      .restart:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }

      .footnote {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 8px 2px 1px;
      }

      .hint {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        color: var(--muted);
        font-size: 0.68rem;
        line-height: 1.35;
      }

      .hint-icon {
        display: grid;
        width: 19px;
        height: 19px;
        flex: 0 0 auto;
        place-items: center;
        border: 2px solid var(--ink);
        border-radius: 50%;
        font-size: 0.62rem;
      }

      .restart {
        flex: 0 0 auto;
        padding: 5px 2px;
        border: 0;
        color: var(--muted);
        background: none;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: underline;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(20, 18, 28, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 390px);
        padding: 26px 22px 22px;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: var(--paper);
        box-shadow: 9px 9px 0 var(--ink);
        text-align: center;
        transform: translateY(16px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card {
        transform: translateY(0) scale(1);
      }

      /* A fotografia inteira vem também para dentro do cartão: é ela o prémio. */
      .celebration-photo {
        position: relative;
        z-index: 1;
        display: block;
        height: 195px;
        margin: -26px -22px 12px;
        border-bottom: 3px solid var(--ink);
        /* A tira apanha as duas caras e os dois emblemas ao peito. */
        background: url("./assets/photo.jpg") center 5% / cover no-repeat;
      }

      .celebration h2 {
        margin: 0;
        color: var(--yellow);
        font-family: "Bangers", "DM Sans", sans-serif;
        font-size: clamp(2rem, 10vw, 3rem);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-shadow: 3px 3px 0 var(--red), 5px 5px 0 var(--ink);
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
      }

      .celebration p {
        margin: 13px auto 18px;
        color: #4a4453;
        font-size: 0.93rem;
        line-height: 1.55;
      }

      .celebration-button {
        width: 100%;
      }

      .burst-piece {
        position: absolute;
        width: 10px;
        height: 24px;
        border: 1px solid var(--ink);
        animation: rain 1.9s ease-in infinite;
      }

      .burst-piece:nth-child(1) { top: -28px; left: 11%; background: var(--red); animation-delay: -0.3s; }
      .burst-piece:nth-child(2) { top: -28px; left: 30%; background: var(--yellow); animation-delay: -1.1s; }
      .burst-piece:nth-child(3) { top: -28px; left: 52%; background: var(--blue); animation-delay: -0.7s; }
      .burst-piece:nth-child(4) { top: -28px; right: 25%; background: var(--cyan); animation-delay: -1.5s; }
      .burst-piece:nth-child(5) { top: -28px; right: 8%; background: var(--orange); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes chomp {
        0%, 100% { clip-path: polygon(100% 24%, 52% 50%, 100% 76%, 100% 100%, 0 100%, 0 0, 100% 0); }
        50% { clip-path: polygon(100% 48%, 52% 50%, 100% 52%, 100% 100%, 0 100%, 0 0, 100% 0); }
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(0.72); }
      }

      @keyframes blink {
        0%, 100% { background: #2b3ad6; }
        50% { background: #f2f2ff; }
      }

      @keyframes pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); }
        22% { opacity: 1; transform: translate(-50%, -50%) scale(1.06) rotate(4deg); }
        70% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1) rotate(2deg); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(400px) rotate(280deg); }
      }

      @media (max-height: 700px) and (orientation: portrait) {
        .page-shell { padding-top: 8px; padding-bottom: 10px; }
        .cover-bar { margin-bottom: 6px; }
        h1 { margin-bottom: 7px; font-size: 1.8rem; }
        .game-card { padding: 8px; }
        .scoreboard { margin-bottom: 6px; }
        .villains { display: none; }
        .deck { margin-top: 7px; }
        .pad-button { min-height: 40px; }
        .control-button { min-height: 40px; }
        .footnote { margin-top: 6px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 32px; }
        .maze { width: min(100%, 42svh, 430px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <main>
        <div class="cover-bar">
          <span class="cover-logo">ANIVERSÁRIOS</span>
          <span class="cover-issue">Nº 8 · edição de colecção</span>
        </div>

        <h1>Parabéns,<em>Diogo &amp; Bernardo!</em></h1>

        <section class="game-card" aria-label="Pac-Man de aniversário">
          <div class="scoreboard" aria-live="polite">
            <div>
              <span class="stat-label">Pontos</span>
              <span class="stat-value" id="score">0</span>
            </div>
            <span class="hero-tag" id="heroTag" data-hero="0">Protest Man</span>
            <div>
              <span class="stat-label">Heróis</span>
              <span class="lives" id="lives" role="img" aria-label="3 heróis de reserva"></span>
            </div>
          </div>

          <div class="maze" id="maze" data-state="ready" role="group" aria-label="Labirinto">
            <div class="actors" id="actors" aria-hidden="true">
              <div class="actor hero" id="hero"></div>
            </div>
            <div class="burst" id="burst" aria-hidden="true">POW!</div>
            <div class="board-note" id="boardNote"><span id="boardNoteText">Toca em COMEÇAR</span></div>
            <div class="puzzle-preview" id="preview" aria-hidden="true"></div>
          </div>

          <div class="villains" id="villains" role="list" aria-label="Os quatro vilões"></div>

          <div class="deck">
            <div class="pad">
              <button class="pad-button" type="button" data-dir="up" aria-label="Ir para cima">▲</button>
              <button class="pad-button" type="button" data-dir="left" aria-label="Ir para a esquerda">◀</button>
              <button class="pad-button" type="button" data-dir="down" aria-label="Ir para baixo">▼</button>
              <button class="pad-button" type="button" data-dir="right" aria-label="Ir para a direita">▶</button>
            </div>

            <div class="controls">
              <button class="control-button primary" id="startButton" type="button">Começar</button>
              <button class="control-button secondary" id="previewButton" type="button" aria-pressed="false">Ver fotografia</button>
            </div>
          </div>

          <div class="footnote">
            <p class="hint"><span class="hint-icon" aria-hidden="true">★</span>Arrasta o dedo pelo tabuleiro — cada pastilha destapa a fotografia.</p>
            <button class="restart" id="restartButton" type="button">Recomeçar</button>
          </div>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst-piece" aria-hidden="true"></i>
        <i class="burst-piece" aria-hidden="true"></i>
        <i class="burst-piece" aria-hidden="true"></i>
        <i class="burst-piece" aria-hidden="true"></i>
        <i class="burst-piece" aria-hidden="true"></i>
        <span class="celebration-photo" role="img" aria-label="Fotografia do Diogo e do Bernardo, já inteira"></span>
        <h2 id="celebrationTitle">Fim da missão</h2>
        <p id="celebrationText">Muitos parabéns, Diogo e Bernardo!</p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>
    <script>
      (() => {
        "use strict";

        // Tudo o que muda de puzzle para puzzle vive aqui.
        const PUZZLE = {
          names: "Diogo e Bernardo",
          wish: "Que a dupla continue a safar-se de tudo — e que o próximo ano seja todo de números altos.",
        };

        /*
         * Os dois heróis da capa. Só um está no labirinto de cada vez: cada
         * pastilha grande passa o turno ao outro, e é por isso que vale a pena
         * guardá-las para quando os vilões apertam.
         */
        const HEROES = [
          { name: "Protest Man", who: "Diogo", color: "#e62429" },
          { name: "Capitão Subsídio", who: "Bernardo", color: "#1f3f9e" },
        ];

        /*
         * Os quatro vilões. Cada um pensa à sua maneira: um vai a direito atrás
         * do herói, outro corta-lhe o caminho, outro apanha-o pelo outro lado, e
         * o último só se atreve quando o herói está longe.
         */
        const VILLAINS = [
          { name: "O Carimbo", color: "#e62429", mind: "chase", corner: { r: 1, c: 10 }, home: { r: 7, c: 5 }, release: 0 },
          { name: "A Papelada", color: "#ff7bb0", mind: "ambush", corner: { r: 1, c: 1 }, home: { r: 7, c: 6 }, release: 20 },
          { name: "O Prazo", color: "#2ec4d9", mind: "flank", corner: { r: 16, c: 10 }, home: { r: 8, c: 5 }, release: 46 },
          { name: "A Fila", color: "#ff8a2b", mind: "patrol", corner: { r: 16, c: 1 }, home: { r: 8, c: 6 }, release: 78 },
        ];

        /*
         * O labirinto, casa a casa: # é parede, - é a porta do covil (só os
         * vilões passam por ela), . é pastilha, o é uma pastilha de poder e o
         * espaço é o chão do covil. As duas pontas da linha 9 estão abertas: é
         * o túnel que dá a volta ao tabuleiro.
         *
         * São 12 colunas por 18 linhas — 2 : 3, tal como a fotografia —, por
         * isso cada casa mostra o seu pedaço dela sem esticar nada.
         */
        const MAZE = [
          "############",
          "#o...##...o#",
          "#.##.##.##.#",
          "#..........#",
          "#.##.##.##.#",
          "#.#......#.#",
          "#.#.#--#.#.#",
          "#...#  #...#",
          "##..#  #..##",
          "....####....",
          "#.#......#.#",
          "#.#.####.#.#",
          "#..........#",
          "#.##.##.##.#",
          "#o##.##.##o#",
          "#....##....#",
          "#..........#",
          "############",
        ];

        const ROWS = MAZE.length;
        const COLS = MAZE[0].length;

        const START = { r: 12, c: 5 };   // onde o herói começa, por baixo do covil
        const GATE = { r: 5, c: 5 };     // a casa logo acima da porta do covil
        const TICK = 155;                // milissegundos por casa andada
        const LIVES = 3;
        const FRIGHT_TICKS = 42;         // quanto dura o poder de uma pastilha grande
        const DEATH_PAUSE = 1100;        // o compasso de espera depois de ser apanhado
        const PARTY_DELAY = 2200;        // e o de ver a fotografia inteira antes da festa
        const SHY_RANGE = 8;             // a partir daqui, A Fila ganha coragem
        const DOT_POINTS = 10;
        const POWER_POINTS = 50;
        const GHOST_POINTS = [200, 400, 800, 1600];
        // As fases do jogo: os vilões passam a vida entre espalhar-se e caçar.
        const PHASES = [
          { mode: "scatter", ticks: 32 },
          { mode: "chase", ticks: 120 },
          { mode: "scatter", ticks: 28 },
          { mode: "chase", ticks: Infinity },
        ];
        const SHOUTS = ["POW!", "ZAP!", "BAM!", "BOOM!"];

        const DIRS = {
          up: { dr: -1, dc: 0, rot: 270 },
          left: { dr: 0, dc: -1, rot: 180 },
          down: { dr: 1, dc: 0, rot: 90 },
          right: { dr: 0, dc: 1, rot: 0 },
        };
        // A ordem por que os vilões desempatam caminhos, como no jogo original.
        const ORDER = ["up", "left", "down", "right"];
        const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

        const maze = document.querySelector("#maze");
        const actors = document.querySelector("#actors");
        const hero = document.querySelector("#hero");
        const burst = document.querySelector("#burst");
        const boardNote = document.querySelector("#boardNote");
        const boardNoteText = document.querySelector("#boardNoteText");
        const villainList = document.querySelector("#villains");
        const heroTag = document.querySelector("#heroTag");
        const scoreValue = document.querySelector("#score");
        const livesBox = document.querySelector("#lives");
        const startButton = document.querySelector("#startButton");
        const previewButton = document.querySelector("#previewButton");
        const restartButton = document.querySelector("#restartButton");
        const preview = document.querySelector("#preview");
        const status = document.querySelector("#status");
        const celebration = document.querySelector("#celebration");
        const celebrationText = document.querySelector("#celebrationText");
        const playAgainButton = document.querySelector("#playAgainButton");

        const cells = [];        // as 216 casas, por linha e coluna
        const ghosts = [];

        let dots = [];           // o que ainda está por comer, casa a casa
        let remaining = 0;
        let dotTotal = 0;        // quantas eram ao princípio
        let score = 0;
        let lives = LIVES;
        let heroIndex = 0;
        let state = "ready";     // ready | playing | paused | dying | over | solved
        let ticks = 0;
        let phase = 0;
        let phaseTick = 0;
        let fright = 0;
        let chain = 0;
        let shout = 0;
        let pac = { ...START, dir: "left", prev: { ...START } };
        let want = null;
        let loopId = null;
        let partyId = null;
        let deathId = null;

        const charAt = (r, c) => MAZE[r][c];
        const wrapCol = (c) => ((c % COLS) + COLS) % COLS;
        const inside = (r) => r >= 0 && r < ROWS;
        /** O herói passa por tudo menos paredes e pela porta do covil. */
        const heroCanEnter = (r, c) => inside(r) && charAt(r, c) !== "#" && charAt(r, c) !== "-";
        /** Os vilões só usam a porta quando estão a sair ou a voltar ao covil. */
        const ghostCanEnter = (r, c, door) =>
          inside(r) && charAt(r, c) !== "#" && (charAt(r, c) !== "-" || door);
        const cellOf = (r, c) => cells[r * COLS + c];
        const stepFrom = (r, c, name) => ({ r: r + DIRS[name].dr, c: wrapCol(c + DIRS[name].dc) });

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        /* ---------------------------------------------------------------- */
        /* Desenhar                                                          */
        /* ---------------------------------------------------------------- */

        function build() {
          for (let r = 0; r < ROWS; r += 1) {
            for (let c = 0; c < COLS; c += 1) {
              const cell = document.createElement("div");
              const kind = charAt(r, c) === "#" ? "wall" : charAt(r, c) === "-" ? "door" : "path";
              cell.className = "cell";
              cell.dataset.kind = kind;
              // A fotografia é a mesma em todas as casas; o que muda é o bocado
              // que cada uma mostra, e esse sai das coordenadas dela.
              cell.style.backgroundImage = 'url("./assets/photo.jpg")';
              cell.style.backgroundPosition = `${(c / (COLS - 1)) * 100}% ${(r / (ROWS - 1)) * 100}%`;
              // As paredes arredondam-se só nos cantos que dão para o corredor:
              // é o que faz os blocos parecerem desenhados a régua e compasso.
              if (kind === "wall") cell.style.setProperty("--corners", wallCorners(r, c));
              cells.push(cell);
              maze.insertBefore(cell, actors);
            }
          }

          VILLAINS.forEach((villain, index) => {
            const ghost = document.createElement("div");
            ghost.className = "actor ghost";
            ghost.id = `ghost${index}`;
            ghost.style.setProperty("--ghost-color", villain.color);
            actors.appendChild(ghost);
            ghosts.push({ ...villain, index, element: ghost, r: villain.home.r, c: villain.home.c, dir: "up", state: "home", releaseAt: villain.release, prev: { ...villain.home } });

            const tag = document.createElement("span");
            tag.className = "villain";
            tag.setAttribute("role", "listitem");
            tag.style.setProperty("--ghost-color", villain.color);
            tag.textContent = villain.name;
            villainList.appendChild(tag);
          });
        }

        /** Um canto de parede só arredonda se as duas casas que lhe tocam forem chão. */
        function wallCorners(r, c) {
          const wall = (rr, cc) => !inside(rr) || charAt(rr, wrapCol(cc)) === "#";
          const up = wall(r - 1, c);
          const down = wall(r + 1, c);
          const left = wall(r, c - 1);
          const right = wall(r, c + 1);
          const size = "44%";
          const zero = "0";
          return [
            !up && !left ? size : zero,
            !up && !right ? size : zero,
            !down && !right ? size : zero,
            !down && !left ? size : zero,
          ].join(" ");
        }

        function place(element, r, c, previous) {
          const jumped = previous && Math.abs(c - previous.c) > 1;
          element.dataset.jump = jumped ? "1" : "";
          element.style.left = `${(c / COLS) * 100}%`;
          element.style.top = `${(r / ROWS) * 100}%`;
        }

        function draw() {
          place(hero, pac.r, pac.c, pac.prev);
          hero.style.setProperty("--rot", `${DIRS[pac.dir].rot}deg`);
          hero.style.setProperty("--hero-color", HEROES[heroIndex].color);

          ghosts.forEach((ghost) => {
            place(ghost.element, ghost.r, ghost.c, ghost.prev);
            const mode =
              ghost.state === "back" ? "back"
              : ghost.state === "home" ? "home"
              : fright > 0 && ghost.state === "out" ? "fright"
              : "hunt";
            ghost.element.dataset.mode = mode;
            ghost.element.dataset.cell = `${ghost.r},${ghost.c}`;
          });

          scoreValue.textContent = String(score);
          heroTag.textContent = HEROES[heroIndex].name;
          heroTag.dataset.hero = String(heroIndex);
          livesBox.innerHTML = "";
          for (let index = 0; index < lives; index += 1) {
            const life = document.createElement("i");
            life.className = "life";
            life.style.background = HEROES[index % HEROES.length].color;
            livesBox.appendChild(life);
          }
          livesBox.setAttribute("aria-label", `${lives} heróis de reserva`);

          maze.dataset.state = state;
          maze.dataset.pac = `${pac.r},${pac.c}`;
          maze.dataset.dir = pac.dir;
          maze.dataset.dots = String(remaining);
          maze.dataset.eaten = String(dotTotal - remaining);
          maze.dataset.lives = String(lives);
          maze.dataset.score = String(score);
          maze.dataset.hero = String(heroIndex);
          maze.dataset.fright = String(fright);
          maze.dataset.tick = String(ticks);
        }

        function setNote(text) {
          boardNoteText.textContent = text;
          boardNote.classList.toggle("visible", Boolean(text));
        }

        function setStartLabel() {
          startButton.disabled = state === "solved" || state === "dying";
          startButton.textContent =
            state === "playing" ? "Pausa"
            : state === "paused" ? "Continuar"
            : state === "over" ? "Continuar"
            : "Começar";
        }

        function showBurst(text) {
          burst.textContent = text;
          burst.classList.remove("visible");
          // Reler a largura obriga o browser a recomeçar a animação do balão.
          void burst.offsetWidth;
          burst.classList.add("visible");
        }

        /* ---------------------------------------------------------------- */
        /* O herói                                                           */
        /* ---------------------------------------------------------------- */

        function turn(name) {
          if (!DIRS[name]) return;
          want = name;
          if (state === "ready") start();
        }

        function moveHero() {
          pac.prev = { r: pac.r, c: pac.c };
          if (want) {
            const wanted = stepFrom(pac.r, pac.c, want);
            if (heroCanEnter(wanted.r, wanted.c)) {
              pac.dir = want;
              want = null;
            }
          }
          const next = stepFrom(pac.r, pac.c, pac.dir);
          if (!heroCanEnter(next.r, next.c)) return;
          pac.r = next.r;
          pac.c = next.c;
        }

        function eat() {
          const index = pac.r * COLS + pac.c;
          const food = dots[index];
          if (!food) return;
          dots[index] = null;
          remaining -= 1;
          cells[index].dataset.dot = "";
          cells[index].dataset.shown = "1";

          if (food === "power") {
            score += POWER_POINTS;
            fright = FRIGHT_TICKS;
            chain = 0;
            heroIndex = (heroIndex + 1) % HEROES.length;
            ghosts.forEach((ghost) => {
              if (ghost.state === "out") ghost.dir = OPPOSITE[ghost.dir];
            });
            showBurst(SHOUTS[shout % SHOUTS.length]);
            shout += 1;
            announce(`${HEROES[heroIndex].name} entra em campo!`);
            playChime([659.25, 880]);
          } else {
            score += DOT_POINTS;
          }
        }

        /* ---------------------------------------------------------------- */
        /* Os vilões                                                         */
        /* ---------------------------------------------------------------- */

        function targetFor(ghost) {
          if (ghost.state === "home" || ghost.state === "back") return ghost.home;
          if (ghost.state === "leaving") return GATE;
          if (PHASES[phase].mode === "scatter") return ghost.corner;

          const ahead = (steps) => ({
            r: pac.r + DIRS[pac.dir].dr * steps,
            c: pac.c + DIRS[pac.dir].dc * steps,
          });

          if (ghost.mind === "chase") return { r: pac.r, c: pac.c };
          if (ghost.mind === "ambush") return ahead(4);
          if (ghost.mind === "flank") {
            const pivot = ahead(2);
            const lead = ghosts[0];
            return { r: pivot.r * 2 - lead.r, c: pivot.c * 2 - lead.c };
          }
          // A Fila só persegue de longe: ao pé do herói, foge para o seu canto.
          const gap = Math.hypot(ghost.r - pac.r, ghost.c - pac.c);
          return gap > SHY_RANGE ? { r: pac.r, c: pac.c } : ghost.corner;
        }

        function ghostMovesNow(ghost) {
          if (ghost.state === "home") return false;
          if (ghost.state === "back") return true;          // os olhos voltam a correr
          if (fright > 0 && ghost.state === "out") return ticks % 2 === 0;
          return ticks % 4 !== 0;                           // três casas em cada quatro
        }

        function moveGhost(ghost) {
          const door = ghost.state !== "out";
          const flee = fright > 0 && ghost.state === "out";
          const target = targetFor(ghost);
          let best = null;

          for (const name of ORDER) {
            if (ghost.state === "out" && name === OPPOSITE[ghost.dir]) continue;
            const next = stepFrom(ghost.r, ghost.c, name);
            if (!ghostCanEnter(next.r, next.c, door)) continue;
            const distance = (next.r - target.r) ** 2 + (next.c - target.c) ** 2;
            const score2 = flee ? -distance : distance;
            if (best === null || score2 < best.score2) best = { ...next, name, score2 };
          }

          // Sem saída à frente (só acontece a quem acaba de dar meia volta): recua.
          if (!best) {
            const back = stepFrom(ghost.r, ghost.c, OPPOSITE[ghost.dir]);
            if (!ghostCanEnter(back.r, back.c, door)) return;
            best = { ...back, name: OPPOSITE[ghost.dir] };
          }

          ghost.prev = { r: ghost.r, c: ghost.c };
          ghost.r = best.r;
          ghost.c = best.c;
          ghost.dir = best.name;

          if (ghost.state === "back" && ghost.r === ghost.home.r && ghost.c === ghost.home.c) {
            ghost.state = "home";
            ghost.releaseAt = ticks + 24;
          }
          if (ghost.state === "leaving" && ghost.r === GATE.r && ghost.c === GATE.c) {
            ghost.state = "out";
          }
        }

        function moveGhosts() {
          ghosts.forEach((ghost) => {
            if (ghost.state === "home" && ticks >= ghost.releaseAt) ghost.state = "leaving";
            if (!ghostMovesNow(ghost)) {
              ghost.prev = { r: ghost.r, c: ghost.c };
              return;
            }
            moveGhost(ghost);
          });
        }

        /** Os vilões que estão em cima do herói — ou que se cruzaram com ele. */
        function contacts() {
          return ghosts.filter((ghost) => {
            if (ghost.state !== "out" && ghost.state !== "leaving") return false;
            if (ghost.r === pac.r && ghost.c === pac.c) return true;
            // Trocaram de casa um com o outro: também conta como apanhar.
            return ghost.r === pac.prev.r && ghost.c === pac.prev.c
              && pac.r === ghost.prev.r && pac.c === ghost.prev.c;
          });
        }

        /** Devolve true se o toque acabou com a jogada (o herói foi apanhado). */
        function resolveContacts() {
          const touched = contacts();
          if (!touched.length) return false;

          if (fright > 0) {
            touched.forEach((ghost) => {
              if (ghost.state === "back") return;
              score += GHOST_POINTS[Math.min(chain, GHOST_POINTS.length - 1)];
              chain += 1;
              ghost.state = "back";
              ghost.element.dataset.mode = "back";
            });
            playChime([784, 1046.5]);
            return false;
          }

          loseLife();
          return true;
        }

        /* ---------------------------------------------------------------- */
        /* O jogo                                                            */
        /* ---------------------------------------------------------------- */

        function step() {
          if (state !== "playing") return;
          ticks += 1;
          phaseTick += 1;
          if (phaseTick >= PHASES[phase].ticks && phase < PHASES.length - 1) {
            phase += 1;
            phaseTick = 0;
            // A mudança de fase faz os vilões darem meia volta, como no original.
            ghosts.forEach((ghost) => {
              if (ghost.state === "out") ghost.dir = OPPOSITE[ghost.dir];
            });
          }
          if (fright > 0) {
            fright -= 1;
            if (fright === 0) chain = 0;
          }

          moveHero();
          eat();
          if (remaining === 0) {
            win();
            return;
          }
          if (resolveContacts()) return;
          moveGhosts();
          if (resolveContacts()) return;
          draw();
        }

        function startLoop() {
          window.clearInterval(loopId);
          loopId = window.setInterval(step, TICK);
        }

        function stopLoop() {
          window.clearInterval(loopId);
          loopId = null;
        }

        function start() {
          if (state === "solved" || state === "dying") return;
          if (state === "over") {
            // Perder não apaga a fotografia já destapada: voltam os três heróis.
            lives = LIVES;
            resetActors();
          }
          state = "playing";
          setNote("");
          setStartLabel();
          startLoop();
          draw();
        }

        function pause() {
          if (state !== "playing") return;
          state = "paused";
          stopLoop();
          setNote("Em pausa");
          setStartLabel();
          draw();
        }

        function toggleStart() {
          if (state === "playing") pause();
          else start();
        }

        function resetActors() {
          pac = { ...START, dir: "left", prev: { ...START } };
          want = null;
          fright = 0;
          chain = 0;
          phase = 0;
          phaseTick = 0;
          ticks = 0;
          ghosts.forEach((ghost) => {
            ghost.r = ghost.home.r;
            ghost.c = ghost.home.c;
            ghost.prev = { ...ghost.home };
            ghost.dir = "up";
            ghost.state = "home";
            ghost.releaseAt = ghost.release;
          });
        }

        function loseLife() {
          lives -= 1;
          state = "dying";
          stopLoop();
          setStartLabel();
          draw();
          announce(lives > 0 ? `Apanharam-te! Faltam ${lives}.` : "Os vilões ganharam esta.");
          playChime([392, 261.63]);

          window.clearTimeout(deathId);
          deathId = window.setTimeout(() => {
            if (lives <= 0) {
              state = "over";
              setNote("Apanharam-te!");
              setStartLabel();
              draw();
              return;
            }
            resetActors();
            state = "playing";
            setStartLabel();
            startLoop();
            draw();
          }, DEATH_PAUSE);
        }

        function win() {
          state = "solved";
          stopLoop();
          maze.classList.add("solved");
          maze.dataset.solved = "1";
          setNote("");
          setStartLabel();
          draw();
          celebrationText.textContent =
            `Limparam o labirinto todo — ${dotTotal} pastilhas, ${score} pontos — e a fotografia ficou inteira. `
            + `Muitos parabéns, ${PUZZLE.names}! ${PUZZLE.wish}`;
          announce("Labirinto limpo. Parabéns!");
          playChime([523.25, 659.25, 783.99, 1046.5]);
          // Um compasso de espera para se ver o tabuleiro já todo fotografia.
          window.clearTimeout(partyId);
          partyId = window.setTimeout(() => {
            celebration.classList.add("visible");
            celebration.setAttribute("aria-hidden", "false");
            playAgainButton.focus();
          }, PARTY_DELAY);
        }

        function hideCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        function setPreview(visible) {
          preview.classList.toggle("visible", visible);
          previewButton.setAttribute("aria-pressed", String(visible));
          previewButton.textContent = visible ? "Voltar ao jogo" : "Ver fotografia";
        }

        function restart() {
          hideCelebration();
          stopLoop();
          window.clearTimeout(partyId);
          window.clearTimeout(deathId);
          maze.classList.remove("solved");
          delete maze.dataset.solved;

          dots = [];
          remaining = 0;
          for (let r = 0; r < ROWS; r += 1) {
            for (let c = 0; c < COLS; c += 1) {
              const index = r * COLS + c;
              const symbol = charAt(r, c);
              const food = symbol === "o" ? "power" : symbol === "." ? "dot" : null;
              dots.push(food);
              cells[index].dataset.dot = food === "power" ? "power" : food === "dot" ? "dot" : "";
              cells[index].dataset.shown = "";
              if (food) remaining += 1;
            }
          }
          dotTotal = remaining;

          score = 0;
          lives = LIVES;
          heroIndex = 0;
          shout = 0;
          state = "ready";
          resetActors();
          setPreview(false);
          setNote("Toca em COMEÇAR");
          setStartLabel();
          draw();
        }

        function playChime(notes) {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audio = new AudioContext();
            notes.forEach((frequency, index) => {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.type = "square";
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, audio.currentTime + index * 0.09);
              gain.gain.linearRampToValueAtTime(0.07, audio.currentTime + index * 0.09 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + index * 0.09 + 0.3);
              oscillator.connect(gain).connect(audio.destination);
              oscillator.start(audio.currentTime + index * 0.09);
              oscillator.stop(audio.currentTime + index * 0.09 + 0.32);
            });
            window.setTimeout(() => audio.close(), 800);
          } catch (_) {
            // O som é um extra; o jogo joga-se todo sem ele.
          }
        }

        /* ---------------------------------------------------------------- */
        /* Comandos                                                          */
        /* ---------------------------------------------------------------- */

        document.querySelectorAll(".pad-button").forEach((button) => {
          button.addEventListener("click", () => turn(button.dataset.dir));
        });

        startButton.addEventListener("click", toggleStart);
        restartButton.addEventListener("click", () => {
          restart();
          announce("Labirinto outra vez cheio. Boa sorte!");
        });
        previewButton.addEventListener("click", () => setPreview(!preview.classList.contains("visible")));
        playAgainButton.addEventListener("click", () => {
          restart();
          startButton.focus();
        });
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) hideCelebration();
        });

        const KEYS = {
          ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
          w: "up", s: "down", a: "left", d: "right",
          W: "up", S: "down", A: "left", D: "right",
        };

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setPreview(false);
            hideCelebration();
            return;
          }
          const direction = KEYS[event.key];
          if (direction) {
            event.preventDefault();
            turn(direction);
            return;
          }
          if (event.key === " " && !event.target.closest?.("button, input")) {
            event.preventDefault();
            toggleStart();
          }
        });

        /*
         * No telemóvel joga-se com o dedo por cima do tabuleiro: arrasta-se para
         * o lado para onde se quer virar, e o herói vira mal possa.
         */
        let swipe = null;

        maze.addEventListener("pointerdown", (event) => {
          swipe = { x: event.clientX, y: event.clientY, done: false };
          maze.setPointerCapture?.(event.pointerId);
        });

        maze.addEventListener("pointermove", (event) => {
          if (!swipe || swipe.done) return;
          const dx = event.clientX - swipe.x;
          const dy = event.clientY - swipe.y;
          if (Math.hypot(dx, dy) < 16) return;
          swipe.done = true;
          turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
        });

        maze.addEventListener("pointerup", (event) => {
          const tap = swipe && !swipe.done;
          swipe = null;
          maze.releasePointerCapture?.(event.pointerId);
          // Um toque sem arrastar começa (ou pára) o jogo.
          if (tap) toggleStart();
        });

        maze.addEventListener("pointercancel", () => { swipe = null; });

        build();
        restart();
      })();
    </script>
  </body>
</html>
