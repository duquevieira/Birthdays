<!doctype html><meta charset="utf-8">
<iframe id="f" src="/puzzles/diogo-bernardo/index.html" style="width:390px;height:844px;border:0"></iframe>
<script>
  document.querySelector("#f").addEventListener("load", () => {
    const w = document.querySelector("#f").contentWindow, d = w.document;
    d.querySelector("#startButton").click();
    w.setTimeout(() => {
      const h = d.querySelector("#hero");
      const cs = w.getComputedStyle(h);
      document.title = "var=" + h.style.getPropertyValue("--hero-color")
        + " | bg=" + cs.backgroundImage.slice(0, 90)
        + " | w=" + cs.width + " h=" + cs.height
        + " | clip=" + cs.clipPath.slice(0, 40);
    }, 900);
  });
</script>
