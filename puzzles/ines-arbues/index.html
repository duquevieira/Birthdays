<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />

    <title>Parabéns, Inês Arbués! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap");

      /*
       * As cores saem todas da fotografia: a camisola de malha creme, a luz doirada
       * do fim de tarde, a terra da falésia e o azul lavado do mar ao fundo.
       */
      :root {
        --ink: #4a382e;
        --muted: #8d7767;
        --terracotta: #b05f38;
        --terracotta-dark: #94492a;
        --gold: #d99b52;
        --sea: #8fa9b4;
        --cream: #fffaf2;
        --paper: rgba(255, 255, 255, 0.86);
        --tile-gap: clamp(3px, 1vw, 6px);
        --shadow: 0 24px 70px rgba(112, 70, 44, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #f2dcc4;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.95) 0 5%, transparent 20%),
          radial-gradient(circle at 92% 18%, rgba(217, 155, 82, 0.22) 0 8%, transparent 27%),
          linear-gradient(155deg, #fffaf2 0%, #fbeedd 49%, #f2dcc4 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      .page-shell::before,
      .page-shell::after {
        position: fixed;
        z-index: -1;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(176, 95, 56, 0.12);
        border-radius: 50%;
        content: "";
      }

      .page-shell::before {
        top: -115px;
        left: -92px;
        box-shadow: 0 0 0 34px rgba(217, 155, 82, 0.07), 0 0 0 68px rgba(217, 155, 82, 0.045);
      }

      .page-shell::after {
        right: -130px;
        bottom: -100px;
        box-shadow: 0 0 0 40px rgba(143, 169, 180, 0.09), 0 0 0 80px rgba(143, 169, 180, 0.05);
      }

      .confetti-piece {
        position: fixed;
        z-index: -1;
        width: 8px;
        height: 18px;
        border-radius: 6px;
        opacity: 0.5;
        transform: rotate(var(--rotate));
      }

      .confetti-piece:nth-child(1) { top: 8%; left: 7%; background: var(--gold); --rotate: 25deg; }
      .confetti-piece:nth-child(2) { top: 19%; right: 8%; width: 11px; height: 11px; background: var(--terracotta); --rotate: 45deg; }
      .confetti-piece:nth-child(3) { top: 52%; left: 4%; background: var(--sea); --rotate: -25deg; }
      .confetti-piece:nth-child(4) { right: 5%; bottom: 18%; background: var(--gold); --rotate: 65deg; }

      main {
        width: min(100%, 470px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 0 0 8px;
        color: var(--terracotta);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.45;
      }

      h1 {
        max-width: 390px;
        margin: 0 auto 20px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.35rem, 11vw, 4.2rem);
        line-height: 0.94;
        text-align: center;
        letter-spacing: -0.045em;
      }

      h1 em {
        color: var(--terracotta);
        font-weight: 700;
      }

      .game-card {
        padding: clamp(12px, 3.5vw, 18px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 30px;
        background: var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin: 2px 3px 13px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .stat:last-child {
        justify-content: flex-end;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .stat-value {
        min-width: 1.6ch;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.35rem;
        font-variant-numeric: tabular-nums;
      }

      .level-badge {
        padding: 7px 11px;
        border-radius: 999px;
        color: var(--terracotta-dark);
        background: rgba(176, 95, 56, 0.1);
        font-size: 0.7rem;
        font-weight: 700;
      }

      .puzzle-wrap {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        padding: var(--tile-gap);
        border-radius: 22px;
        background: #e8d3bb;
        box-shadow: inset 0 0 0 1px rgba(74, 56, 46, 0.09);
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * As peças nunca mudam de sítio — só de ângulo. Por isso a grelha basta,
       * não é preciso posicionar nada à mão. O --size vem da constante SIZE.
       */
      .puzzle {
        display: grid;
        gap: var(--tile-gap);
        width: 100%;
        height: 100%;
        grid-template-columns: repeat(var(--size, 3), 1fr);
        grid-template-rows: repeat(var(--size, 3), 1fr);
        transition: gap 260ms ease;
      }

      .puzzle.solved {
        gap: 0;
      }

      .tile {
        padding: 0;
        border: 0;
        border-radius: clamp(8px, 2.6vw, 14px);
        background-image: url("./assets/photo.jpg");
        background-repeat: no-repeat;
        box-shadow: 0 4px 10px rgba(74, 45, 30, 0.2);
        cursor: pointer;
        transition: transform 260ms cubic-bezier(0.22, 0.75, 0.35, 1), box-shadow 160ms ease, border-radius 260ms ease;
        will-change: transform;
      }

      .tile:hover {
        box-shadow: 0 7px 16px rgba(74, 45, 30, 0.28);
      }

      .tile:focus-visible,
      .control-button:focus-visible,
      .celebration-button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }

      .puzzle.solved .tile {
        border-radius: 0;
        box-shadow: none;
        cursor: default;
      }

      .puzzle-preview {
        position: absolute;
        inset: 0;
        z-index: 4;
        border-radius: 18px;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        opacity: 0;
        pointer-events: none;
        transform: scale(1.025);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .puzzle-preview.visible {
        opacity: 1;
        transform: scale(1);
      }

      .controls {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 10px;
        margin-top: 13px;
      }

      .control-button,
      .celebration-button {
        min-height: 50px;
        border: 0;
        border-radius: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 130ms ease, box-shadow 130ms ease, background 130ms ease;
      }

      .control-button:active,
      .celebration-button:active {
        transform: translateY(2px);
      }

      .control-button.primary,
      .celebration-button {
        color: white;
        background: var(--terracotta);
        box-shadow: 0 8px 18px rgba(176, 95, 56, 0.24);
      }

      .control-button.primary:hover,
      .celebration-button:hover {
        background: var(--terracotta-dark);
      }

      .control-button.secondary {
        color: var(--ink);
        background: #f3e7d8;
      }

      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 13px 0 1px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
      }

      .hint-icon {
        display: grid;
        width: 19px;
        height: 19px;
        place-items: center;
        border: 1px solid rgba(141, 119, 103, 0.34);
        border-radius: 50%;
        font-size: 0.68rem;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(66, 43, 28, 0.46);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
        backdrop-filter: blur(9px);
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 390px);
        padding: 30px 24px 24px;
        overflow: hidden;
        border-radius: 30px;
        background: var(--cream);
        box-shadow: 0 28px 80px rgba(58, 34, 18, 0.32);
        text-align: center;
        transform: translateY(18px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card {
        transform: translateY(0) scale(1);
      }

      .celebration-emoji {
        display: block;
        margin-bottom: 8px;
        font-size: 2.5rem;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .celebration h2 {
        margin: 0;
        color: var(--terracotta);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 10vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .celebration p {
        margin: 14px auto 20px;
        color: var(--muted);
        line-height: 1.55;
      }

      .celebration-button {
        width: 100%;
      }

      .burst {
        position: absolute;
        width: 10px;
        height: 26px;
        border-radius: 10px;
        animation: rain 1.8s ease-in infinite;
      }

      .burst:nth-child(1) { top: -28px; left: 10%; background: var(--terracotta); animation-delay: -0.3s; }
      .burst:nth-child(2) { top: -28px; left: 29%; background: var(--gold); animation-delay: -1.1s; }
      .burst:nth-child(3) { top: -28px; left: 51%; background: var(--sea); animation-delay: -0.7s; }
      .burst:nth-child(4) { top: -28px; right: 26%; background: #e3b877; animation-delay: -1.5s; }
      .burst:nth-child(5) { top: -28px; right: 8%; background: var(--terracotta); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes bounce {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-6px); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(390px) rotate(260deg); }
      }

      @media (max-height: 720px) and (orientation: portrait) {
        .page-shell { padding-top: 12px; padding-bottom: 14px; }
        .eyebrow { margin-bottom: 5px; }
        h1 { margin-bottom: 11px; font-size: 2.2rem; }
        .game-card { padding: 11px; border-radius: 24px; }
        .scoreboard { margin-bottom: 8px; }
        .controls { margin-top: 9px; }
        .control-button { min-height: 44px; }
        .hint { margin-top: 8px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 38px; }
        h1 { margin-bottom: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>

      <main>
        <p class="eyebrow">Um dia muito especial</p>
        <h1>Parabéns, <em>Inês!</em></h1>

        <section class="game-card" aria-label="Puzzle de aniversário">
          <div class="scoreboard" aria-live="polite">
            <div class="stat">
              <span class="stat-label">Jogadas</span>
              <span class="stat-value" id="moveCount">0</span>
            </div>
            <span class="level-badge">Rodar 3 × 3</span>
            <div class="stat">
              <span class="stat-label">Tempo</span>
              <span class="stat-value" id="timer">0:00</span>
            </div>
          </div>

          <div class="puzzle-wrap" id="puzzleWrap">
            <div class="puzzle" id="puzzle" role="group" aria-label="Puzzle de rotação 3 por 3"></div>
            <div class="puzzle-preview" id="preview" aria-hidden="true"></div>
          </div>

          <div class="controls">
            <button class="control-button primary" id="shuffleButton" type="button">Baralhar peças</button>
            <button class="control-button secondary" id="previewButton" type="button" aria-pressed="false">Ver fotografia</button>
          </div>
          <p class="hint"><span class="hint-icon" aria-hidden="true">↻</span>Toca numa peça para a rodares até ficar direita.</p>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <span class="celebration-emoji" aria-hidden="true">🎂</span>
        <h2 id="celebrationTitle">Um dia espacial</h2>
        <p id="celebrationText">Muitos parabéns, Inês! Que este novo ano te traga sol, mar e muitos motivos para sorrir.</p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        // Tudo o que muda de puzzle para puzzle vive aqui.
        const PUZZLE = {
          name: "Inês",
          wish: "Que este novo ano te traga sol, mar e muitos motivos para sorrir.",
        };

        const SIZE = 3;
        const TILES = SIZE * SIZE;
        const QUARTER_TURN = 90;
        const puzzle = document.querySelector("#puzzle");
        const moveCount = document.querySelector("#moveCount");
        const timer = document.querySelector("#timer");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const previewButton = document.querySelector("#previewButton");
        const shuffleButton = document.querySelector("#shuffleButton");
        const celebration = document.querySelector("#celebration");
        const celebrationText = document.querySelector("#celebrationText");
        const playAgainButton = document.querySelector("#playAgainButton");

        // rotations[peça] = quantos quartos de volta faltam desfazer (0 a 3).
        let rotations = new Array(TILES).fill(0);
        // angles[peça] = o ângulo que o CSS anima, e que só cresce. Se desenhássemos
        // o ângulo a partir do rotations, a última volta de cada peça (270° → 0°)
        // seria animada ao contrário: três quartos para trás em vez de um para a frente.
        let angles = new Array(TILES).fill(0);
        let moves = 0;
        let seconds = 0;
        let timerId = null;
        let gameStarted = false;
        let solved = false;
        const tiles = [];

        const row = (index) => Math.floor(index / SIZE);
        const column = (index) => index % SIZE;
        const isSolved = () => rotations.every((turns) => turns === 0);

        function formatTime(value) {
          const minutes = Math.floor(value / 60);
          return `${minutes}:${String(value % 60).padStart(2, "0")}`;
        }

        function updateStats() {
          moveCount.textContent = String(moves);
          timer.textContent = formatTime(seconds);
        }

        function startTimer() {
          if (timerId || solved) return;
          timerId = window.setInterval(() => {
            seconds += 1;
            updateStats();
          }, 1000);
        }

        function stopTimer() {
          window.clearInterval(timerId);
          timerId = null;
        }

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        function describe(index) {
          const turns = rotations[index];
          const place = `Peça ${index + 1}`;
          return turns === 0 ? `${place}, direita` : `${place}, rodada ${turns * QUARTER_TURN} graus`;
        }

        function renderTiles(animate = true) {
          puzzle.classList.toggle("solved", solved);

          tiles.forEach((tile, index) => {
            tile.style.transitionDuration = animate ? "" : "0ms";
            tile.style.transform = `rotate(${angles[index]}deg)`;
            tile.dataset.rotation = String(rotations[index]);
            tile.setAttribute("aria-label", describe(index));
            tile.disabled = solved;
          });
        }

        function rotateTile(index) {
          if (solved) return false;

          if (!gameStarted) {
            gameStarted = true;
            startTimer();
          }

          rotations[index] = (rotations[index] + 1) % 4;
          angles[index] += QUARTER_TURN;
          moves += 1;
          updateStats();

          if (isSolved()) {
            completeGame();
          } else {
            renderTiles();
            announce(describe(index));
          }
          return true;
        }

        function shuffle() {
          hideCelebration();
          stopTimer();
          gameStarted = false;
          solved = false;
          moves = 0;
          seconds = 0;

          // Pelo menos metade das peças fica torta — assim nunca sai um tabuleiro
          // já resolvido nem um que se desfaça com dois toques.
          const leastCrooked = Math.ceil(TILES / 2);
          do {
            rotations = Array.from({ length: TILES }, () => Math.floor(Math.random() * 4));
          } while (rotations.filter((turns) => turns !== 0).length < leastCrooked);

          // O baralhar não é animado, por isso pode voltar a partir do ângulo pequeno.
          angles = rotations.map((turns) => turns * QUARTER_TURN);

          updateStats();
          renderTiles(false);
          window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
            tiles.forEach((tile) => { tile.style.transitionDuration = ""; });
          }));
          announce("As peças foram baralhadas. Boa sorte!");
        }

        function completeGame() {
          solved = true;
          stopTimer();
          renderTiles();
          celebrationText.textContent = `Endireitaste a fotografia em ${moves} ${moves === 1 ? "jogada" : "jogadas"} e ${formatTime(seconds)}. Muitos parabéns, ${PUZZLE.name}! ${PUZZLE.wish}`;
          announce("Fotografia direita. Parabéns!");
          window.setTimeout(showCelebration, 650);
          playChime();
        }

        function showCelebration() {
          celebration.classList.add("visible");
          celebration.setAttribute("aria-hidden", "false");
          playAgainButton.focus();
        }

        function hideCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        function setPreview(visible) {
          preview.classList.toggle("visible", visible);
          previewButton.setAttribute("aria-pressed", String(visible));
          previewButton.textContent = visible ? "Voltar ao puzzle" : "Ver fotografia";
        }

        function playChime() {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audio = new AudioContext();
            const notes = [523.25, 659.25, 783.99];
            notes.forEach((frequency, index) => {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, audio.currentTime + index * 0.12);
              gain.gain.linearRampToValueAtTime(0.12, audio.currentTime + index * 0.12 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + index * 0.12 + 0.4);
              oscillator.connect(gain).connect(audio.destination);
              oscillator.start(audio.currentTime + index * 0.12);
              oscillator.stop(audio.currentTime + index * 0.12 + 0.42);
            });
            window.setTimeout(() => audio.close(), 900);
          } catch (_) {
            // Audio is a small bonus; the game remains fully playable without it.
          }
        }

        function createTiles() {
          // A grelha e o recorte da fotografia saem os dois do SIZE, para que
          // mudar a dificuldade seja mesmo mudar um número só.
          puzzle.style.setProperty("--size", String(SIZE));
          const step = 100 / (SIZE - 1);

          for (let index = 0; index < TILES; index += 1) {
            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile";
            // Cada peça mostra sempre o mesmo pedaço da fotografia: só o ângulo muda.
            tile.style.backgroundSize = `${SIZE * 100}% ${SIZE * 100}%`;
            tile.style.backgroundPosition = `${column(index) * step}% ${row(index) * step}%`;
            tile.addEventListener("click", () => rotateTile(index));
            tiles.push(tile);
            puzzle.appendChild(tile);
          }
        }

        shuffleButton.addEventListener("click", shuffle);
        previewButton.addEventListener("click", () => setPreview(!preview.classList.contains("visible")));
        playAgainButton.addEventListener("click", () => {
          shuffle();
          shuffleButton.focus();
        });
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) hideCelebration();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setPreview(false);
            hideCelebration();
          }
        });

        createTiles();
        shuffle();
      })();
    </script>
  </body>
</html>
