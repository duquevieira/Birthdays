    <title>Parabéns, Filipe e Francisco! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap");

      /*
       * O jogo das caixinhas é o do caderno da escola, e a página é o caderno:
       * papel quadriculado, tinta azul-escura, e as duas cores dos jogadores
       * tiradas das próprias fotografias — o azul do dragão e o bronze da
       * estátua. O campo é o único sítio onde as fotografias estão escondidas.
       */
      :root {
        --ink: #22304a;
        --muted: #7b8299;
        --paper: #fbf6ea;
        --paper-deep: #efe6d0;
        --line: rgba(34, 48, 74, 0.1);
        --a: #2f6fc4;
        --a-dark: #1f4d8c;
        --a-soft: rgba(47, 111, 196, 0.13);
        --b: #a97c3f;
        --b-dark: #7c5828;
        --b-soft: rgba(169, 124, 63, 0.15);
        --gold: #e4b23c;
        --shadow: 0 24px 70px rgba(34, 48, 74, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #f0e7d4;
      }

      /* O papel quadriculado: duas grelhas de linhas finas por cima do creme. */
      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 26px 26px,
          linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 26px 26px,
          radial-gradient(circle at 12% 6%, rgba(47, 111, 196, 0.12) 0 6%, transparent 26%),
          radial-gradient(circle at 88% 12%, rgba(169, 124, 63, 0.14) 0 7%, transparent 28%),
          linear-gradient(155deg, #fdfaf2 0%, #f7efdd 52%, #efe3ca 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      main {
        width: min(100%, 430px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 26px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.45;
      }

      h1 {
        margin: 0 auto 12px;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(1.85rem, 8.4vw, 2.9rem);
        font-weight: 900;
        line-height: 0.96;
        text-align: center;
        letter-spacing: -0.035em;
      }

      h1 .a { color: var(--a); }
      h1 .b { color: var(--b); }

      .game-card {
        padding: clamp(11px, 3.2vw, 16px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      /* O placar: cada jogador de um lado, e o do meio diz quantas caixas faltam. */
      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        margin: 0 1px 10px;
      }

      .player {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        border: 2px solid transparent;
        border-radius: 999px;
        transition: border-color 160ms ease, background 160ms ease;
      }

      .player.b {
        flex-direction: row-reverse;
      }

      .player-face {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border: 2px solid #fff;
        border-radius: 50%;
        background-repeat: no-repeat;
        background-position: 50% 18%;
        background-size: 250%;
        box-shadow: 0 2px 6px rgba(34, 48, 74, 0.22);
      }

      .player.a .player-face { background-image: url("./assets/photo-a.jpg"); }
      .player.b .player-face { background-image: url("./assets/photo-b.jpg"); }

      .player-text {
        display: grid;
        gap: 1px;
        line-height: 1;
      }

      .player.b .player-text { text-align: right; }

      .player-name {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .player.a .player-name { color: var(--a-dark); }
      .player.b .player-name { color: var(--b-dark); }

      .player-score {
        font-family: "Fraunces", Georgia, serif;
        font-size: 1.2rem;
        font-variant-numeric: tabular-nums;
      }

      /* O jogador da vez fica com o anel da sua cor à volta. */
      .player.is-turn { border-color: currentColor; }
      .player.a.is-turn { color: var(--a); background: var(--a-soft); }
      .player.b.is-turn { color: var(--b); background: var(--b-soft); }

      .boxes-left {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(34, 48, 74, 0.07);
        color: var(--muted);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        line-height: 1.15;
        text-align: center;
        text-transform: uppercase;
      }

      .boxes-left b {
        display: block;
        color: var(--ink);
        font-family: "Fraunces", Georgia, serif;
        font-size: 1rem;
        letter-spacing: 0;
      }

      /* O campo: 4 × 6 caixas, portanto sempre 2 : 3, tal como as fotografias. */
      .field-wrap {
        position: relative;
        width: min(100%, 44svh, 380px);
        margin: 0 auto;
        aspect-ratio: 2 / 3;
        padding: 10px;
        border-radius: 20px;
        background: var(--paper-deep);
        box-shadow: inset 0 0 0 1px rgba(34, 48, 74, 0.1);
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .field {
        position: absolute;
        inset: 10px;
      }

      /* Camada de baixo: as caixas, tapadas até alguém as fechar. */
      .box {
        position: absolute;
        overflow: hidden;
        border-radius: 5px;
        background-color: #e2d6bb;
        background-repeat: no-repeat;
        background-size: 400% 600%;
        box-shadow: inset 0 0 0 1px rgba(34, 48, 74, 0.05);
        transition: transform 240ms cubic-bezier(0.22, 0.8, 0.32, 1), border-radius 240ms ease, box-shadow 240ms ease;
      }

      .box.is-taken {
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
        animation: pop 340ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .box[data-owner="0"] { background-image: url("./assets/photo-a.jpg"); }
      .box[data-owner="1"] { background-image: url("./assets/photo-b.jpg"); }

      /* Camada do meio: os riscos. Por fazer são um fantasma; feitos, são de quem os fez. */
      .edge {
        position: absolute;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .edge::before {
        position: absolute;
        border-radius: 999px;
        background: rgba(34, 48, 74, 0.16);
        content: "";
        transition: background 160ms ease, opacity 160ms ease;
      }

      .edge.h::before {
        top: 50%;
        right: 3px;
        left: 3px;
        height: 4px;
        transform: translateY(-50%);
      }

      .edge.v::before {
        top: 3px;
        bottom: 3px;
        left: 50%;
        width: 4px;
        transform: translateX(-50%);
      }

      .edge:not(.is-drawn)::before { opacity: 0.34; }

      @media (hover: hover) {
        .edge:not(.is-drawn):hover::before { opacity: 1; background: rgba(34, 48, 74, 0.4); }
      }

      .edge.is-drawn { cursor: default; }
      .edge.is-drawn::before { opacity: 1; }
      .edge.is-drawn[data-owner="0"]::before { background: var(--a); }
      .edge.is-drawn[data-owner="1"]::before { background: var(--b); }

      /* O último risco fica um instante mais grosso, para se ver quem jogou. */
      .edge.is-fresh::before { animation: ink 420ms ease-out; }

      /* Camada de cima: os pontos do caderno. */
      .dot {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(34, 48, 74, 0.45);
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: opacity 420ms ease;
      }

      /* Fechado o jogo, a grelha some-se e fica só o mosaico dos dois. */
      .field.is-complete .dot { opacity: 0; }
      .field.is-complete .edge::before { opacity: 0; }
      .field.is-complete .box { border-radius: 0; box-shadow: none; }

      .turn-line {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: center;
      }

      .turn-line b { color: var(--ink); }

      .controls {
        margin-top: 10px;
      }

      .control-button,
      .celebration-button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 15px;
        color: #fff;
        background: var(--ink);
        font-weight: 700;
        cursor: pointer;
        transition: transform 130ms ease, background 130ms ease;
      }

      .control-button:hover,
      .celebration-button:hover { background: #16233a; }

      .control-button:active,
      .celebration-button:active { transform: translateY(2px); }

      .edge:focus-visible,
      .control-button:focus-visible,
      .celebration-button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }

      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 10px 0 1px;
        color: var(--muted);
        font-size: 0.73rem;
        text-align: center;
      }

      .hint-icon {
        display: grid;
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        place-items: center;
        border: 1px solid rgba(123, 130, 153, 0.4);
        border-radius: 50%;
        font-size: 0.66rem;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(24, 34, 54, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
        backdrop-filter: blur(9px);
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 380px);
        padding: 26px 22px 22px;
        overflow: hidden;
        border-radius: 28px;
        background: var(--paper);
        box-shadow: 0 28px 80px rgba(20, 30, 48, 0.34);
        text-align: center;
        transform: translateY(18px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card { transform: none; }

      .celebration-emoji {
        display: block;
        margin-bottom: 6px;
        font-size: 2.3rem;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .celebration h2 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(1.7rem, 8.5vw, 2.5rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
      }

      /* As duas fotografias inteiras, com o resultado por baixo de cada uma. */
      .celebration-photos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 16px 0 12px;
      }

      .celebration-photo {
        padding: 5px;
        border-radius: 14px;
        background: rgba(34, 48, 74, 0.05);
      }

      .celebration-photo.is-winner {
        background: var(--gold);
        box-shadow: 0 6px 18px rgba(228, 178, 60, 0.45);
      }

      .celebration-photo i {
        display: block;
        aspect-ratio: 2 / 3;
        border-radius: 10px;
        background-position: 50% 4%;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .celebration-photo.a i { background-image: url("./assets/photo-a.jpg"); }
      .celebration-photo.b i { background-image: url("./assets/photo-b.jpg"); }

      .celebration-photo span {
        display: block;
        padding-top: 5px;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .celebration-photo.a span { color: var(--a-dark); }
      .celebration-photo.b span { color: var(--b-dark); }

      .celebration p {
        margin: 0 auto 18px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .burst {
        position: absolute;
        width: 9px;
        height: 24px;
        border-radius: 10px;
        animation: rain 1.8s ease-in infinite;
      }

      .burst:nth-child(1) { top: -28px; left: 10%; background: var(--a); animation-delay: -0.3s; }
      .burst:nth-child(2) { top: -28px; left: 29%; background: var(--gold); animation-delay: -1.1s; }
      .burst:nth-child(3) { top: -28px; left: 51%; background: var(--b); animation-delay: -0.7s; }
      .burst:nth-child(4) { top: -28px; right: 26%; background: var(--a); animation-delay: -1.5s; }
      .burst:nth-child(5) { top: -28px; right: 8%; background: var(--b); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes pop {
        from { transform: scale(0.62); }
        60% { transform: scale(1.06); }
        to { transform: scale(1); }
      }

      @keyframes ink {
        from { opacity: 0.2; transform: translate(0, -50%) scaleX(0.3); }
      }

      @keyframes bounce {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-6px); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(380px) rotate(260deg); }
      }

      @media (max-height: 760px) and (orientation: portrait) {
        .page-shell { padding-top: 10px; padding-bottom: 12px; }
        .eyebrow { margin-bottom: 4px; }
        h1 { margin-bottom: 9px; font-size: 1.7rem; }
        .game-card { padding: 10px; border-radius: 22px; }
        .scoreboard { margin-bottom: 8px; }
        .turn-line { margin-top: 8px; }
        .controls { margin-top: 8px; }
        .control-button { min-height: 44px; }
        .hint { margin-top: 8px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 34px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <main>
        <p class="eyebrow">Um dia muito especial</p>
        <h1>Parabéns, <span class="a">Filipe</span> &amp; <span class="b">Francisco!</span></h1>

        <section class="game-card" aria-label="Jogo das caixinhas de aniversário">
          <div class="scoreboard">
            <div class="player a" id="playerA">
              <span class="player-face" aria-hidden="true"></span>
              <span class="player-text">
                <span class="player-name">Filipe</span>
                <span class="player-score" id="scoreA">0</span>
              </span>
            </div>
            <p class="boxes-left">Faltam<b id="boxesLeft">24</b></p>
            <div class="player b" id="playerB">
              <span class="player-face" aria-hidden="true"></span>
              <span class="player-text">
                <span class="player-name">Francisco</span>
                <span class="player-score" id="scoreB">0</span>
              </span>
            </div>
          </div>

          <div class="field-wrap">
            <div class="field" id="field" role="group" aria-label="Campo de 4 por 6 caixas"></div>
          </div>

          <p class="turn-line" id="turnLine">É a vez do <b>Filipe</b>.</p>

          <div class="controls">
            <button class="control-button" id="newGameButton" type="button">Novo jogo</button>
          </div>
          <p class="hint"><span class="hint-icon" aria-hidden="true">✎</span>Fecha uma caixa e jogas outra vez.</p>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <span class="celebration-emoji" aria-hidden="true">🎂</span>
        <h2 id="celebrationTitle">Parabéns!</h2>
        <div class="celebration-photos">
          <div class="celebration-photo a" id="cardPhotoA">
            <i aria-hidden="true"></i>
            <span id="cardCaptionA">Filipe — 0 caixas</span>
          </div>
          <div class="celebration-photo b" id="cardPhotoB">
            <i aria-hidden="true"></i>
            <span id="cardCaptionB">Francisco — 0 caixas</span>
          </div>
        </div>
        <p id="celebrationText"></p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        // Tudo o que muda de puzzle para puzzle vive aqui.
        const PUZZLE = {
          players: [
            { name: "Filipe", article: "do" },
            { name: "Francisco", article: "do" },
          ],
          wish: "Que este novo ano vos traga tantas vitórias quantas as caixas deste campo.",
        };

        const COLS = 4;
        const ROWS = 6;
        const BOXES = COLS * ROWS;
        // A página dá tempo a ver o campo já todo fotografia antes de abrir a festa.
        const PARTY_DELAY = 2500;

        const field = document.querySelector("#field");
        const scoreNodes = [document.querySelector("#scoreA"), document.querySelector("#scoreB")];
        const playerNodes = [document.querySelector("#playerA"), document.querySelector("#playerB")];
        const boxesLeft = document.querySelector("#boxesLeft");
        const turnLine = document.querySelector("#turnLine");
        const status = document.querySelector("#status");
        const newGameButton = document.querySelector("#newGameButton");
        const celebration = document.querySelector("#celebration");
        const celebrationTitle = document.querySelector("#celebrationTitle");
        const celebrationText = document.querySelector("#celebrationText");
        const cardPhotos = [document.querySelector("#cardPhotoA"), document.querySelector("#cardPhotoB")];
        const cardCaptions = [document.querySelector("#cardCaptionA"), document.querySelector("#cardCaptionB")];
        const playAgainButton = document.querySelector("#playAgainButton");

        // Um risco tem nome: "h-linha-coluna" para os deitados, "v-linha-coluna"
        // para os ao alto. É por esse nome que se sabe se já está feito.
        const horizontalKey = (row, column) => `h-${row}-${column}`;
        const verticalKey = (row, column) => `v-${row}-${column}`;
        const boxIndex = (row, column) => row * COLS + column;

        /** Os quatro lados de uma caixa, sempre pela mesma ordem. */
        function sidesOf(index) {
          const row = Math.floor(index / COLS);
          const column = index % COLS;
          return [
            horizontalKey(row, column),
            horizontalKey(row + 1, column),
            verticalKey(row, column),
            verticalKey(row, column + 1),
          ];
        }

        /** As caixas (uma ou duas) que um risco fecha. */
        function boxesTouching(key) {
          const [kind, row, column] = key.split("-");
          const line = Number(row);
          const cell = Number(column);
          if (kind === "h") {
            return [line > 0 ? boxIndex(line - 1, cell) : -1, line < ROWS ? boxIndex(line, cell) : -1];
          }
          return [cell > 0 ? boxIndex(line, cell - 1) : -1, cell < COLS ? boxIndex(line, cell) : -1];
        }

        const boxNodes = [];
        const edgeNodes = new Map();

        let drawn = new Set();
        let owner = new Array(BOXES).fill(-1);
        let scores = [0, 0];
        let turn = 0;
        let games = 0;
        let finished = false;
        let partyTimer = null;

        const percent = (value, total) => `${(value / total) * 100}%`;

        /** O campo desenha-se uma única vez: as caixas, os riscos e os pontos. */
        function buildField() {
          field.textContent = "";
          boxNodes.length = 0;
          edgeNodes.clear();

          for (let index = 0; index < BOXES; index += 1) {
            const row = Math.floor(index / COLS);
            const column = index % COLS;
            const box = document.createElement("div");
            box.className = "box";
            box.dataset.index = String(index);
            box.style.left = percent(column, COLS);
            box.style.top = percent(row, ROWS);
            box.style.width = percent(1, COLS);
            box.style.height = percent(1, ROWS);
            // A fotografia entra inteira em cada caixa e é o recorte que mostra
            // só o bocado dela, por isso as caixas casam ao milímetro.
            box.style.backgroundPosition = `${(column / (COLS - 1)) * 100}% ${(row / (ROWS - 1)) * 100}%`;
            field.append(box);
            boxNodes.push(box);
          }

          for (let row = 0; row <= ROWS; row += 1) {
            for (let column = 0; column < COLS; column += 1) {
              addEdge(horizontalKey(row, column), "h", row, column);
            }
          }

          for (let row = 0; row < ROWS; row += 1) {
            for (let column = 0; column <= COLS; column += 1) {
              addEdge(verticalKey(row, column), "v", row, column);
            }
          }

          for (let row = 0; row <= ROWS; row += 1) {
            for (let column = 0; column <= COLS; column += 1) {
              const dot = document.createElement("span");
              dot.className = "dot";
              dot.style.left = percent(column, COLS);
              dot.style.top = percent(row, ROWS);
              field.append(dot);
            }
          }
        }

        /**
         * Cada risco é um botão: a barra que se vê é fina, mas a área que
         * se toca é larga, para caber num dedo mesmo num telemóvel pequeno.
         */
        function addEdge(key, kind, row, column) {
          const edge = document.createElement("button");
          edge.type = "button";
          edge.className = `edge ${kind}`;
          edge.dataset.edge = key;
          const readable = kind === "h" ? "deitado" : "ao alto";
          edge.setAttribute("aria-label", `Risco ${readable} na linha ${row + 1}, coluna ${column + 1}`);

          if (kind === "h") {
            edge.style.left = percent(column, COLS);
            edge.style.top = percent(row, ROWS);
            edge.style.width = percent(1, COLS);
            edge.style.height = "26px";
            edge.style.transform = "translateY(-50%)";
          } else {
            edge.style.left = percent(column, COLS);
            edge.style.top = percent(row, ROWS);
            edge.style.width = "26px";
            edge.style.height = percent(1, ROWS);
            edge.style.transform = "translateX(-50%)";
          }

          edge.addEventListener("click", () => play(key));
          field.append(edge);
          edgeNodes.set(key, edge);
        }

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        function updateStats() {
          scores.forEach((score, index) => {
            scoreNodes[index].textContent = String(score);
            playerNodes[index].classList.toggle("is-turn", !finished && turn === index);
          });
          boxesLeft.textContent = String(BOXES - scores[0] - scores[1]);
          turnLine.innerHTML = finished
            ? "Campo fechado."
            : `É a vez ${PUZZLE.players[turn].article} <b>${PUZZLE.players[turn].name}</b>.`;
          field.dataset.turn = String(turn);
          field.dataset.scoreA = String(scores[0]);
          field.dataset.scoreB = String(scores[1]);
          field.dataset.taken = String(scores[0] + scores[1]);
          field.dataset.finished = finished ? "true" : "false";
        }

        /** Uma jogada: risca-se, fecham-se as caixas que fecharem, e só se passa a vez se não fechar nenhuma. */
        function play(key) {
          if (finished || drawn.has(key)) return;

          drawn.add(key);
          const edge = edgeNodes.get(key);
          edge.classList.add("is-drawn", "is-fresh");
          edge.dataset.owner = String(turn);
          edge.disabled = true;
          window.setTimeout(() => edge.classList.remove("is-fresh"), 460);

          const claimed = boxesTouching(key).filter(
            (index) => index >= 0 && owner[index] === -1 && sidesOf(index).every((side) => drawn.has(side)),
          );

          claimed.forEach((index) => {
            owner[index] = turn;
            scores[turn] += 1;
            const box = boxNodes[index];
            box.classList.add("is-taken");
            box.dataset.owner = String(turn);
            box.setAttribute("role", "img");
            box.setAttribute("aria-label", `Caixa ${PUZZLE.players[turn].article} ${PUZZLE.players[turn].name}`);
          });

          const player = PUZZLE.players[turn].name;
          if (claimed.length === 0) {
            turn = 1 - turn;
          } else {
            announce(`${player} fechou ${claimed.length === 1 ? "uma caixa" : "duas caixas"}.`);
          }

          updateStats();
          if (scores[0] + scores[1] === BOXES) finish();
        }

        /** Fechado o campo, cai a grelha, fica o mosaico, e só depois entra a festa. */
        function finish() {
          finished = true;
          field.classList.add("is-complete");
          edgeNodes.forEach((edge) => { edge.disabled = true; });
          updateStats();
          announce("O campo ficou completo.");
          partyTimer = window.setTimeout(openCelebration, PARTY_DELAY);
        }

        function openCelebration() {
          const [first, second] = scores;
          const names = PUZZLE.players.map((player) => player.name);

          cardCaptions.forEach((caption, index) => {
            caption.textContent = `${names[index]} — ${scores[index]} ${scores[index] === 1 ? "caixa" : "caixas"}`;
          });

          const draw = first === second;
          const winner = first > second ? 0 : 1;
          cardPhotos.forEach((photo, index) => {
            photo.classList.toggle("is-winner", !draw && index === winner);
          });

          celebrationTitle.textContent = draw ? "Empate!" : `Ganhou o ${names[winner]}!`;
          celebrationText.textContent = draw
            ? `Doze caixas cada um: o campo ficou meio ${names[0]}, meio ${names[1]}. Muitos parabéns aos dois! ${PUZZLE.wish}`
            : `Muitos parabéns, ${names[0]} e ${names[1]}! ${PUZZLE.wish}`;

          celebration.classList.add("visible");
          celebration.setAttribute("aria-hidden", "false");
          playAgainButton.focus();
        }

        function closeCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        /** Novo jogo: o campo volta ao princípio e começa o outro, à vez. */
        function newGame() {
          window.clearTimeout(partyTimer);
          closeCelebration();

          drawn = new Set();
          owner = new Array(BOXES).fill(-1);
          scores = [0, 0];
          finished = false;
          games += 1;
          turn = games % 2;

          field.classList.remove("is-complete");
          boxNodes.forEach((box) => {
            box.classList.remove("is-taken");
            delete box.dataset.owner;
            box.removeAttribute("role");
            box.removeAttribute("aria-label");
          });
          edgeNodes.forEach((edge) => {
            edge.classList.remove("is-drawn", "is-fresh");
            delete edge.dataset.owner;
            edge.disabled = false;
          });

          updateStats();
          announce(`Campo limpo. Começa ${PUZZLE.players[turn].article} ${PUZZLE.players[turn].name}.`);
        }

        newGameButton.addEventListener("click", newGame);
        playAgainButton.addEventListener("click", newGame);
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) closeCelebration();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && celebration.classList.contains("visible")) closeCelebration();
        });

        buildField();
        updateStats();
      })();
    </script>
  </body>
</html>
