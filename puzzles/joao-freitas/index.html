<html lang="pt-PT">
  <head>

    <title>Parabéns, João Freitas! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap");

      /*
       * As cores saem todas da fotografia: a areia da pirâmide, o azul lavado do
       * céu do Egipto, o turquesa do reflexo dos óculos — e o verde do relvado,
       * que é o único que a fotografia não tinha.
       */
      :root {
        --ink: #33302a;
        --muted: #7d7264;
        --sky: #1f5fa8;
        --sky-dark: #17497f;
        --sand: #d8b477;
        --turquoise: #2fb3c4;
        --grass: #5aa062;
        --grass-dark: #3f7d4a;
        --cream: #fdfaf3;
        --paper: rgba(255, 255, 255, 0.86);
        --tile-gap: clamp(2px, 0.7vw, 4px);
        --shadow: 0 24px 70px rgba(51, 48, 42, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #cfe0f2;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.95) 0 5%, transparent 20%),
          radial-gradient(circle at 92% 18%, rgba(216, 180, 119, 0.3) 0 8%, transparent 27%),
          linear-gradient(155deg, #fdfaf3 0%, #f3e3c6 48%, #cfe0f2 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      .page-shell::before,
      .page-shell::after {
        position: fixed;
        z-index: -1;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(31, 95, 168, 0.16);
        border-radius: 50%;
        content: "";
      }

      .page-shell::before {
        top: -115px;
        left: -92px;
        box-shadow: 0 0 0 34px rgba(31, 95, 168, 0.07), 0 0 0 68px rgba(31, 95, 168, 0.04);
      }

      .page-shell::after {
        right: -130px;
        bottom: -100px;
        box-shadow: 0 0 0 40px rgba(216, 180, 119, 0.14), 0 0 0 80px rgba(216, 180, 119, 0.08);
      }

      .confetti-piece {
        position: fixed;
        z-index: -1;
        width: 8px;
        height: 18px;
        border-radius: 6px;
        opacity: 0.5;
        transform: rotate(var(--rotate));
      }

      .confetti-piece:nth-child(1) { top: 8%; left: 7%; background: var(--sky); --rotate: 25deg; }
      .confetti-piece:nth-child(2) { top: 19%; right: 8%; width: 11px; height: 11px; background: var(--sand); --rotate: 45deg; }
      .confetti-piece:nth-child(3) { top: 52%; left: 4%; background: var(--turquoise); --rotate: -25deg; }
      .confetti-piece:nth-child(4) { right: 5%; bottom: 18%; background: var(--grass); --rotate: 65deg; }

      main {
        width: min(100%, 470px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 0 0 6px;
        color: var(--sky);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.45;
      }

      h1 {
        max-width: 390px;
        margin: 0 auto 14px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.1rem, 9.5vw, 3.6rem);
        line-height: 0.94;
        text-align: center;
        letter-spacing: -0.045em;
      }

      h1 em {
        color: var(--sky);
        font-weight: 700;
      }

      .game-card {
        padding: clamp(10px, 3vw, 16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        background: var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        margin: 2px 3px 11px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .stat:last-child {
        justify-content: flex-end;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .stat-value {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.35rem;
        font-variant-numeric: tabular-nums;
      }

      .stat-goal {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .hole-badge {
        padding: 7px 11px;
        border-radius: 999px;
        color: var(--sky-dark);
        background: rgba(31, 95, 168, 0.1);
        font-size: 0.7rem;
        font-weight: 700;
        white-space: nowrap;
      }

      /*
       * O campo é quadrado, tal como a fotografia, e é o mesmo sítio para as duas
       * coisas: por baixo está a fotografia, por cima o relvado que a tapa. Todas
       * as medidas do jogo vão de 0 a 100, por isso desenham-se em percentagem.
       */
      .green {
        position: relative;
        width: min(100%, 52svh, 400px);
        margin: 0 auto;
        overflow: hidden;
        border-radius: 18px;
        aspect-ratio: 1;
        background: #386241;
        box-shadow: inset 0 0 0 1px rgba(51, 48, 42, 0.12), 0 10px 26px rgba(51, 48, 42, 0.12);
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .green::before {
        position: absolute;
        inset: 0;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        content: "";
        opacity: 0.16;
      }

      .turf {
        position: absolute;
        z-index: 1;
        display: grid;
        inset: 0;
        gap: var(--tile-gap);
        padding: var(--tile-gap);
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        transition: gap 400ms ease, padding 400ms ease;
      }

      .turf.solved {
        gap: 0;
        padding: 0;
      }

      /* Cada casa é uma janela para o seu pedaço da fotografia; o relvado é o que está por cima. */
      .tile {
        position: relative;
        border-radius: clamp(3px, 1.2vw, 7px);
        transition: border-radius 400ms ease;
      }

      .tile::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          repeating-linear-gradient(102deg, rgba(255, 255, 255, 0.07) 0 9px, transparent 9px 18px),
          linear-gradient(160deg, #63aa6b, #48874f);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        content: "";
        transition: opacity 500ms ease;
      }

      /* Buraco fechado: a fotografia aparece, com um resto de relva por cima. */
      .tile[data-state="open"]::after {
        opacity: 0.17;
      }

      .turf.solved .tile { border-radius: 0; }
      .turf.solved .tile::after { opacity: 0; }

      .hazard {
        position: absolute;
        z-index: 2;
        border-radius: 5px;
      }

      .hazard[data-kind="water"] {
        background: linear-gradient(160deg, rgba(59, 143, 208, 0.88), rgba(31, 95, 168, 0.9));
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.28);
      }

      .hazard[data-kind="sand"] {
        background: linear-gradient(160deg, rgba(240, 223, 192, 0.94), rgba(216, 180, 119, 0.94));
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4);
      }

      .cup {
        position: absolute;
        z-index: 3;
        width: 8%;
        border-radius: 50%;
        aspect-ratio: 1;
        background: radial-gradient(circle at 50% 35%, #1b1814, #0d0c0a);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.8);
        transform: translate(-50%, -50%);
      }

      /* A bandeira sai do buraco para cima; é ela que se vê de longe. */
      .cup::before {
        position: absolute;
        bottom: 50%;
        left: 50%;
        width: 2px;
        height: 140%;
        background: rgba(255, 255, 255, 0.92);
        content: "";
      }

      .cup::after {
        position: absolute;
        bottom: 110%;
        left: 50%;
        width: 115%;
        height: 55%;
        background: var(--sky);
        clip-path: polygon(0 0, 100% 50%, 0 100%);
        content: "";
      }

      /* A linha de mira: aponta para onde a bola vai e cresce com a força. */
      .aim {
        position: absolute;
        z-index: 4;
        height: 2px;
        margin-top: -1px;
        background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.95) 0 5px, transparent 5px 11px);
        opacity: 0;
        pointer-events: none;
        transform-origin: 0 50%;
        transition: opacity 160ms ease;
      }

      .aim.visible {
        opacity: 0.95;
      }

      .ball {
        position: absolute;
        z-index: 5;
        width: 5.2%;
        border-radius: 50%;
        aspect-ratio: 1;
        background: radial-gradient(circle at 34% 30%, #fff, #d9d5cc);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
        transform: translate(-50%, -50%);
      }

      .puzzle-preview {
        position: absolute;
        z-index: 6;
        inset: 0;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        opacity: 0;
        pointer-events: none;
        transform: scale(1.025);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .puzzle-preview.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* O cartão de pontuação: nove casas, uma por buraco. */
      .scorecard {
        display: grid;
        gap: 4px;
        margin-top: 11px;
        grid-template-columns: repeat(9, 1fr);
      }

      .score-box {
        display: grid;
        padding: 4px 0 5px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: inset 0 0 0 1px rgba(51, 48, 42, 0.09);
        gap: 1px;
        text-align: center;
        transition: background 200ms ease, box-shadow 200ms ease;
      }

      .score-hole {
        color: var(--muted);
        font-size: 0.56rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      .score-strokes {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 0.95rem;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .score-box[data-result="playing"] {
        background: rgba(31, 95, 168, 0.12);
        box-shadow: inset 0 0 0 2px rgba(31, 95, 168, 0.4);
      }

      .score-box[data-result="under"] { background: rgba(90, 160, 98, 0.24); }
      .score-box[data-result="under"] .score-strokes { color: var(--grass-dark); }
      .score-box[data-result="par"] { background: rgba(31, 95, 168, 0.14); }
      .score-box[data-result="par"] .score-strokes { color: var(--sky-dark); }
      .score-box[data-result="over"] { background: rgba(216, 180, 119, 0.34); }

      .pad {
        display: grid;
        align-items: center;
        gap: 8px;
        margin-top: 11px;
        grid-template-columns: auto 1fr auto;
      }

      .pad-button {
        display: grid;
        width: 52px;
        min-height: 48px;
        place-items: center;
        border: 0;
        border-radius: 15px;
        color: var(--ink);
        background: #ede2cd;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
      }

      .pad-button:active {
        transform: translateY(2px);
        background: #e2d4b8;
      }

      .power {
        display: grid;
        gap: 1px;
      }

      .power-label {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.63rem;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .power input {
        width: 100%;
        height: 26px;
        margin: 0;
        accent-color: var(--sky);
        cursor: pointer;
      }

      .controls {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .control-button,
      .celebration-button {
        min-height: 46px;
        border: 0;
        border-radius: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 130ms ease, box-shadow 130ms ease, background 130ms ease;
      }

      .control-button:active,
      .celebration-button:active {
        transform: translateY(2px);
      }

      .control-button.primary,
      .celebration-button {
        color: white;
        background: var(--sky);
        box-shadow: 0 8px 18px rgba(31, 95, 168, 0.24);
      }

      .control-button.primary:hover,
      .celebration-button:hover {
        background: var(--sky-dark);
      }

      .control-button.secondary {
        color: var(--ink);
        background: #ede2cd;
      }

      .control-button[disabled],
      .pad-button[disabled] {
        box-shadow: none;
        opacity: 0.45;
        cursor: default;
      }

      .pad-button:focus-visible,
      .control-button:focus-visible,
      .celebration-button:focus-visible,
      .restart:focus-visible,
      .power input:focus-visible {
        outline: 3px solid var(--turquoise);
        outline-offset: 3px;
      }

      .footnote {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 10px 2px 1px;
      }

      .hint {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        color: var(--muted);
        font-size: 0.73rem;
      }

      .hint-icon {
        display: grid;
        width: 19px;
        height: 19px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(125, 114, 100, 0.34);
        border-radius: 50%;
        font-size: 0.68rem;
      }

      .restart {
        flex: 0 0 auto;
        padding: 5px 2px;
        border: 0;
        color: var(--muted);
        background: none;
        font-size: 0.73rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: underline;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(38, 45, 56, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 390px);
        padding: 30px 24px 24px;
        overflow: hidden;
        border-radius: 30px;
        background: var(--cream);
        box-shadow: 0 28px 80px rgba(30, 26, 20, 0.34);
        text-align: center;
        transform: translateY(18px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card {
        transform: translateY(0) scale(1);
      }

      /*
       * A fotografia inteira também vem para dentro do cartão: é ela o prémio, e
       * assim vê-se bem mesmo com a festa aberta por cima do campo.
       */
      .celebration-photo {
        position: relative;
        z-index: 1;
        display: block;
        height: 180px;
        margin: -30px -24px 10px;
        background: url("./assets/photo.jpg") center 70% / cover no-repeat;
        box-shadow: inset 0 -1px 0 rgba(51, 48, 42, 0.12);
      }

      .celebration-emoji {
        display: block;
        margin-bottom: 8px;
        font-size: 2.5rem;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .celebration h2 {
        margin: 0;
        color: var(--sky);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 10vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .celebration p {
        margin: 14px auto 20px;
        color: var(--muted);
        line-height: 1.55;
      }

      .celebration-button {
        width: 100%;
      }

      .burst {
        position: absolute;
        width: 10px;
        height: 26px;
        border-radius: 10px;
        animation: rain 1.8s ease-in infinite;
      }

      .burst:nth-child(1) { top: -28px; left: 10%; background: var(--sky); animation-delay: -0.3s; }
      .burst:nth-child(2) { top: -28px; left: 29%; background: var(--sand); animation-delay: -1.1s; }
      .burst:nth-child(3) { top: -28px; left: 51%; background: var(--turquoise); animation-delay: -0.7s; }
      .burst:nth-child(4) { top: -28px; right: 26%; background: var(--grass); animation-delay: -1.5s; }
      .burst:nth-child(5) { top: -28px; right: 8%; background: var(--sky); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes bounce {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-6px); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(390px) rotate(260deg); }
      }

      @media (max-height: 720px) and (orientation: portrait) {
        .page-shell { padding-top: 10px; padding-bottom: 12px; }
        .eyebrow { margin-bottom: 4px; }
        h1 { margin-bottom: 9px; font-size: 2rem; }
        .game-card { padding: 10px; border-radius: 22px; }
        .scoreboard { margin-bottom: 8px; }
        .green { width: min(100%, 44svh, 400px); }
        .scorecard { margin-top: 8px; }
        .pad { margin-top: 8px; }
        .pad-button { min-height: 44px; }
        .footnote { margin-top: 7px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 34px; }
        h1 { margin-bottom: 20px; }
        .green { width: min(100%, 60svh, 430px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>

      <main>
        <p class="eyebrow">Um dia muito especial</p>
        <h1>Parabéns, <em>João!</em></h1>

        <section class="game-card" aria-label="Minigolfe de aniversário">
          <div class="scoreboard" aria-live="polite">
            <div class="stat">
              <span class="stat-label">Buraco</span>
              <span class="stat-value" id="holeNumber">1</span>
              <span class="stat-goal" id="holeGoal">/9</span>
            </div>
            <span class="hole-badge" id="holeBadge">O primeiro · par 2</span>
            <div class="stat">
              <span class="stat-label">Tacadas</span>
              <span class="stat-value" id="strokeTotal">0</span>
            </div>
          </div>

          <div class="green" id="green" role="group" aria-label="Campo de minigolfe">
            <div class="turf" id="turf"></div>
            <div class="cup" id="cup"></div>
            <div class="aim" id="aim" aria-hidden="true"></div>
            <div class="ball" id="ball"></div>
            <div class="puzzle-preview" id="preview" aria-hidden="true"></div>
          </div>

          <div class="scorecard" id="scorecard" role="img" aria-label="Cartão de pontuação"></div>

          <div class="pad">
            <button class="pad-button" id="aimLeftButton" type="button" aria-label="Rodar a mira para a esquerda">◀</button>
            <label class="power">
              <span class="power-label"><span>Força</span><span id="powerValue">55</span></span>
              <input type="range" id="power" min="10" max="100" step="1" value="55" aria-label="Força da tacada" />
            </label>
            <button class="pad-button" id="aimRightButton" type="button" aria-label="Rodar a mira para a direita">▶</button>
          </div>

          <div class="controls">
            <button class="control-button primary" id="shootButton" type="button">Bater</button>
            <button class="control-button secondary" id="previewButton" type="button" aria-pressed="false">Ver fotografia</button>
          </div>

          <div class="footnote">
            <p class="hint"><span class="hint-icon" aria-hidden="true">⛳</span>Puxa a bola para trás e larga — cada buraco destapa a fotografia.</p>
            <button class="restart" id="restartButton" type="button">Recomeçar</button>
          </div>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <span class="celebration-photo" role="img" aria-label="Fotografia do João, já inteira"></span>
        <span class="celebration-emoji" aria-hidden="true">🎂</span>
        <h2 id="celebrationTitle">Um dia especial</h2>
        <p id="celebrationText">Muitos parabéns, João!</p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        // Tudo o que muda de puzzle para puzzle vive aqui.
        const PUZZLE = {
          name: "João",
          wish: "Que este novo ano te leve a sítios assim — e que a bola caia sempre perto do buraco.",
        };

        /*
         * O campo mede 100 × 100, seja qual for o tamanho do ecrã: a bola, o
         * buraco e os obstáculos são todos escritos nessas unidades e passam a
         * percentagem na altura de os desenhar.
         *
         * Cada buraco tem sempre uma linha directa da bola até ao copo — os
         * obstáculos castigam a pontaria torta, não a certeira.
         */
        const HOLES = [
          {
            name: "O primeiro", par: 2,
            ball: { x: 50, y: 84 }, cup: { x: 50, y: 24 },
          },
          {
            name: "A porta", par: 2,
            ball: { x: 50, y: 86 }, cup: { x: 50, y: 20 },
            walls: [{ x: 0, y: 50, w: 38, h: 6 }, { x: 62, y: 50, w: 38, h: 6 }],
          },
          {
            name: "O lago", par: 3,
            ball: { x: 18, y: 84 }, cup: { x: 76, y: 26 },
            water: [{ x: 0, y: 14, w: 42, h: 36 }],
          },
          {
            name: "A viga", par: 3,
            ball: { x: 16, y: 86 }, cup: { x: 84, y: 32 },
            walls: [{ x: 40, y: 0, w: 7, h: 44 }],
          },
          {
            name: "Os dois portões", par: 3,
            ball: { x: 14, y: 50 }, cup: { x: 86, y: 50 },
            walls: [
              { x: 30, y: 0, w: 8, h: 34 }, { x: 30, y: 66, w: 8, h: 34 },
              { x: 62, y: 0, w: 8, h: 34 }, { x: 62, y: 66, w: 8, h: 34 },
            ],
          },
          {
            name: "A areia", par: 3,
            ball: { x: 50, y: 86 }, cup: { x: 50, y: 20 },
            sand: [{ x: 16, y: 40, w: 26, h: 26 }, { x: 58, y: 40, w: 26, h: 26 }],
          },
          {
            name: "A ponte", par: 3,
            ball: { x: 18, y: 84 }, cup: { x: 82, y: 20 },
            walls: [{ x: 0, y: 44, w: 38, h: 7 }, { x: 66, y: 44, w: 34, h: 7 }],
          },
          {
            name: "O ziguezague", par: 4,
            ball: { x: 12, y: 88 }, cup: { x: 88, y: 12 },
            walls: [{ x: 24, y: 24, w: 30, h: 7 }, { x: 46, y: 62, w: 30, h: 7 }],
          },
          {
            name: "O último", par: 3,
            ball: { x: 50, y: 90 }, cup: { x: 50, y: 14 },
            walls: [{ x: 0, y: 52, w: 40, h: 6 }, { x: 60, y: 52, w: 40, h: 6 }],
            water: [{ x: 0, y: 16, w: 26, h: 30 }, { x: 74, y: 16, w: 26, h: 30 }],
          },
        ];

        /*
         * A bola trava a um ritmo constante, como uma bola a rolar na relva. Com
         * essa travagem, a distância de uma tacada é só v² / (2 × TRAVAGEM) — o
         * que dá um jogo previsível: a mesma força faz sempre o mesmo caminho.
         */
        const TRAVAGEM = 360;      // unidades por segundo, ao quadrado
        const MIN_SPEED = 70;      // a força mínima do cursor
        const MAX_SPEED = 320;     // a máxima: pouco mais do que a diagonal do campo
        const SAND_BRAKE = 3;      // a areia trava três vezes mais
        const BOUNCE = 0.72;       // o que sobra da velocidade depois de bater na tabela
        const BALL = 2.6;          // o raio da bola
        const CUP = 4;             // o raio do buraco — o mesmo que o do desenho
        const CUP_SPEED = 88;      // acima disto a bola passa por cima e não cai
        const AIM_STEP = 2;        // graus por toque nas setas da mira
        const STEP = 1 / 60;       // o passo da simulação, em segundos
        const MAX_STEPS = 420;     // uma tacada nunca rola mais do que sete segundos
        const FRAME_MS = 16;       // o ritmo a que a bola se desenha a rolar
        const HOLE_PAUSE = 500;    // o compasso de espera depois de a bola cair
        const PARTY_DELAY = 2200;  // e o de ver a fotografia inteira antes da festa

        /* Os cantos primeiro, o meio no fim: a cara é a última coisa a aparecer. */
        const REVEAL_ORDER = [0, 2, 6, 8, 1, 3, 5, 7, 4];

        const green = document.querySelector("#green");
        const turf = document.querySelector("#turf");
        const cupMark = document.querySelector("#cup");
        const ballMark = document.querySelector("#ball");
        const aimMark = document.querySelector("#aim");
        const scorecard = document.querySelector("#scorecard");
        const holeNumber = document.querySelector("#holeNumber");
        const holeGoal = document.querySelector("#holeGoal");
        const holeBadge = document.querySelector("#holeBadge");
        const strokeTotal = document.querySelector("#strokeTotal");
        const power = document.querySelector("#power");
        const powerValue = document.querySelector("#powerValue");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const previewButton = document.querySelector("#previewButton");
        const shootButton = document.querySelector("#shootButton");
        const restartButton = document.querySelector("#restartButton");
        const aimLeftButton = document.querySelector("#aimLeftButton");
        const aimRightButton = document.querySelector("#aimRightButton");
        const celebration = document.querySelector("#celebration");
        const celebrationText = document.querySelector("#celebrationText");
        const playAgainButton = document.querySelector("#playAgainButton");

        const tiles = [];
        const boxes = [];

        let hole = 0;          // o índice do buraco que se está a jogar
        let ball = { x: 50, y: 50 };
        let shotFrom = { x: 50, y: 50 };
        let angle = 270;       // graus, com o zero a apontar para a direita
        let strokes = 0;       // as tacadas neste buraco
        let card = [];         // as tacadas de cada buraco já fechado
        let opened = 0;        // quantas casas da fotografia já estão destapadas
        let busy = false;      // a bola a rolar, ou o buraco a mudar
        let solved = false;
        let replayId = null;

        const current = () => HOLES[hole];
        const walls = () => current().walls ?? [];
        const water = () => current().water ?? [];
        const sand = () => current().sand ?? [];
        const totalPar = HOLES.reduce((sum, item) => sum + item.par, 0);
        const totalStrokes = () => card.reduce((sum, value) => sum + value, 0) + strokes;

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        /** O nome que o golfe dá ao resultado de um buraco. */
        function termFor(count, par) {
          if (count === 1) return "hole-in-one";
          const over = count - par;
          if (over <= -2) return "eagle";
          if (over === -1) return "birdie";
          if (over === 0) return "par";
          if (over === 1) return "bogey";
          if (over === 2) return "duplo bogey";
          return `${over} acima do par`;
        }

        /** E o nome que dá ao total da volta. */
        function roundTerm(count) {
          const over = count - totalPar;
          if (over === 0) return "tudo no par";
          if (over < 0) return `${-over} abaixo do par`;
          return `${over} acima do par`;
        }

        const rectsOf = (kind) => (kind === "water" ? water() : kind === "sand" ? sand() : walls());

        /** A bola, com o seu raio, encosta a este rectângulo? */
        function touches(rect, x, y, radius) {
          const nearestX = Math.min(Math.max(x, rect.x), rect.x + rect.w);
          const nearestY = Math.min(Math.max(y, rect.y), rect.y + rect.h);
          return (x - nearestX) ** 2 + (y - nearestY) ** 2 < radius ** 2;
        }

        const blocked = (x, y) => walls().some((rect) => touches(rect, x, y, BALL));
        const inWater = (x, y) => water().some((rect) => touches(rect, x, y, BALL * 0.4));
        const inSand = (x, y) => sand().some((rect) => touches(rect, x, y, BALL * 0.4));

        /** A que distância do buraco passa a bola entre dois instantes. */
        function nearestToCup(fromX, fromY, toX, toY) {
          const cup = current().cup;
          const dx = toX - fromX;
          const dy = toY - fromY;
          const length = dx * dx + dy * dy;
          const t = length === 0 ? 0 : Math.min(1, Math.max(0, ((cup.x - fromX) * dx + (cup.y - fromY) * dy) / length));
          return Math.hypot(fromX + t * dx - cup.x, fromY + t * dy - cup.y);
        }

        /*
         * Uma tacada resolve-se toda de uma vez: o caminho fica guardado ponto a
         * ponto e só depois é que a bola o percorre no ecrã. Assim o que se vê é
         * exactamente o que a física deu, sem depender do ritmo do desenho.
         */
        function simulate(from, degrees, force) {
          const speed = MIN_SPEED + (force / 100) * (MAX_SPEED - MIN_SPEED);
          const radians = (degrees * Math.PI) / 180;
          let vx = Math.cos(radians) * speed;
          let vy = Math.sin(radians) * speed;
          let x = from.x;
          let y = from.y;
          const path = [];

          for (let step = 0; step < MAX_STEPS; step += 1) {
            const brake = TRAVAGEM * (inSand(x, y) ? SAND_BRAKE : 1);
            const was = Math.hypot(vx, vy);
            if (was === 0) break;
            const now = Math.max(0, was - brake * STEP);
            // A bola anda com a velocidade média do passo, não com a do fim: é
            // isso que faz a distância bater certo com v² / (2 × TRAVAGEM).
            const mid = (was + now) / 2;
            const ux = vx / was;
            const uy = vy / was;
            vx = ux * now;
            vy = uy * now;

            const fromX = x;
            const fromY = y;

            // Cada eixo de cada vez: com obstáculos direitos, chega para saber
            // de que lado a bola bateu.
            x += ux * mid * STEP;
            if (x < BALL) { x = BALL; vx = -vx * BOUNCE; }
            else if (x > 100 - BALL) { x = 100 - BALL; vx = -vx * BOUNCE; }
            else if (blocked(x, y)) { x = fromX; vx = -vx * BOUNCE; }

            y += uy * mid * STEP;
            if (y < BALL) { y = BALL; vy = -vy * BOUNCE; }
            else if (y > 100 - BALL) { y = 100 - BALL; vy = -vy * BOUNCE; }
            else if (blocked(x, y)) { y = fromY; vy = -vy * BOUNCE; }

            path.push({ x, y });

            // Devagar e por cima do buraco, cai. Depressa, passa pela borda.
            if (nearestToCup(fromX, fromY, x, y) < CUP && Math.hypot(vx, vy) < CUP_SPEED) {
              path.push({ x: current().cup.x, y: current().cup.y });
              return { path, outcome: "sunk" };
            }

            if (inWater(x, y)) return { path, outcome: "water" };
            if (now === 0) break;
          }

          return { path, outcome: "rest" };
        }

        function drawBall() {
          ballMark.style.left = `${ball.x}%`;
          ballMark.style.top = `${ball.y}%`;
          green.dataset.ball = `${ball.x.toFixed(1)},${ball.y.toFixed(1)}`;
        }

        function drawAim() {
          const force = Number(power.value);
          aimMark.style.left = `${ball.x}%`;
          aimMark.style.top = `${ball.y}%`;
          aimMark.style.width = `${8 + (force / 100) * 30}%`;
          aimMark.style.transform = `rotate(${angle}deg)`;
          aimMark.classList.toggle("visible", !busy && !solved);
          green.dataset.angle = String(angle);
        }

        function drawHole() {
          const { cup, name, par } = current();
          cupMark.style.left = `${cup.x}%`;
          cupMark.style.top = `${cup.y}%`;
          green.dataset.cup = `${cup.x},${cup.y}`;
          green.dataset.hole = String(hole + 1);
          holeNumber.textContent = String(hole + 1);
          holeGoal.textContent = `/${HOLES.length}`;
          holeBadge.textContent = `${name} · par ${par}`;

          green.querySelectorAll(".hazard").forEach((element) => element.remove());
          ["water", "sand"].forEach((kind) => {
            rectsOf(kind).forEach((rect) => {
              const element = document.createElement("div");
              element.className = "hazard";
              element.dataset.kind = kind;
              Object.assign(element.style, {
                left: `${rect.x}%`, top: `${rect.y}%`,
                width: `${rect.w}%`, height: `${rect.h}%`,
              });
              green.insertBefore(element, cupMark);
            });
          });
          walls().forEach((rect) => {
            const element = document.createElement("div");
            element.className = "hazard";
            element.dataset.kind = "wall";
            Object.assign(element.style, {
              left: `${rect.x}%`, top: `${rect.y}%`,
              width: `${rect.w}%`, height: `${rect.h}%`,
              zIndex: "4",
              background: "linear-gradient(160deg, #6d6152, #4a4239)",
              borderRadius: "5px",
              boxShadow: "inset 0 0 0 1px rgba(255, 255, 255, 0.22)",
            });
            green.insertBefore(element, cupMark);
          });
        }

        function drawScorecard() {
          boxes.forEach((box, index) => {
            const played = index < card.length;
            const strokesHere = played ? card[index] : index === hole ? strokes : null;
            box.querySelector(".score-strokes").textContent =
              strokesHere === null || strokesHere === 0 ? "–" : String(strokesHere);
            if (played) {
              const over = card[index] - HOLES[index].par;
              box.dataset.result = over < 0 ? "under" : over === 0 ? "par" : "over";
            } else if (index === hole && !solved) {
              box.dataset.result = "playing";
            } else {
              delete box.dataset.result;
            }
          });
          strokeTotal.textContent = String(totalStrokes());
          green.dataset.strokes = String(strokes);
        }

        function setControls(enabled) {
          [shootButton, aimLeftButton, aimRightButton, power].forEach((control) => {
            control.disabled = !enabled;
          });
        }

        function setBusy(value) {
          busy = value;
          green.dataset.busy = value ? "1" : "";
          setControls(!value && !solved);
          drawAim();
        }

        function aim(step) {
          if (busy || solved) return;
          angle = (angle + step + 360) % 360;
          drawAim();
        }

        function shoot() {
          if (busy || solved) return;
          shotFrom = { ...ball };
          strokes += 1;
          drawScorecard();

          const { path, outcome } = simulate(ball, angle, Number(power.value));
          setBusy(true);
          replay(path, outcome);
        }

        /** A bola percorre no ecrã o caminho que a física já deu. */
        function replay(path, outcome) {
          let index = 0;
          window.clearInterval(replayId);
          replayId = window.setInterval(() => {
            if (index >= path.length) {
              window.clearInterval(replayId);
              replayId = null;
              finishShot(outcome);
              return;
            }
            ball = path[index];
            index += 1;
            drawBall();
          }, FRAME_MS);
        }

        function finishShot(outcome) {
          if (outcome === "water") {
            // A água custa uma tacada e a bola volta ao sítio de onde saiu.
            strokes += 1;
            ball = { ...shotFrom };
            drawBall();
            drawScorecard();
            announce("A bola foi à água. Mais uma tacada, e volta ao sítio.");
            setBusy(false);
            return;
          }

          if (outcome !== "sunk") {
            drawAim();
            announce(`Tacada ${strokes}. A bola parou no relvado.`);
            setBusy(false);
            return;
          }

          const { par } = current();
          // As tacadas passam para o cartão e a conta deste buraco fecha aqui.
          const played = strokes;
          card.push(played);
          strokes = 0;
          openTile();
          drawScorecard();
          announce(`${termFor(played, par)}! O buraco ${hole + 1} está fechado.`);
          playChime(played <= par);

          window.setTimeout(() => {
            if (hole === HOLES.length - 1) {
              completeGame();
              return;
            }
            hole += 1;
            startHole();
            setBusy(false);
          }, HOLE_PAUSE);
        }

        /** Cada buraco fechado levanta a relva de uma casa da fotografia. */
        function openTile() {
          const index = REVEAL_ORDER[opened];
          opened += 1;
          if (index !== undefined) tiles[index].dataset.state = "open";
          green.dataset.opened = String(opened);
        }

        function startHole() {
          ball = { ...current().ball };
          shotFrom = { ...ball };
          // A mira começa virada para o buraco: joga-se logo, e afina-se depois.
          const { cup } = current();
          const straight = (Math.atan2(cup.y - ball.y, cup.x - ball.x) * 180) / Math.PI;
          angle = ((Math.round(straight / AIM_STEP) * AIM_STEP) + 360) % 360;
          drawHole();
          drawBall();
          drawAim();
          drawScorecard();
        }

        function completeGame() {
          solved = true;
          turf.classList.add("solved");
          green.dataset.solved = "1";
          setBusy(false);
          setControls(false);
          aimMark.classList.remove("visible");
          const total = totalStrokes();
          celebrationText.textContent = `Fechaste os nove buracos em ${total} tacadas — ${roundTerm(total)} — e a fotografia ficou inteira. Muitos parabéns, ${PUZZLE.name}! ${PUZZLE.wish}`;
          announce("Fotografia inteira. Parabéns!");
          // Um compasso de espera para se ver o campo já todo fotografia.
          window.setTimeout(() => {
            celebration.classList.add("visible");
            celebration.setAttribute("aria-hidden", "false");
            playAgainButton.focus();
          }, PARTY_DELAY);
          playChime(true);
        }

        function hideCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        function setPreview(visible) {
          preview.classList.toggle("visible", visible);
          previewButton.setAttribute("aria-pressed", String(visible));
          previewButton.textContent = visible ? "Voltar ao jogo" : "Ver fotografia";
        }

        function restart() {
          hideCelebration();
          window.clearInterval(replayId);
          replayId = null;
          hole = 0;
          strokes = 0;
          card = [];
          opened = 0;
          solved = false;
          turf.classList.remove("solved");
          delete green.dataset.solved;
          green.dataset.opened = "0";
          tiles.forEach((tile) => { tile.dataset.state = "grass"; });
          setPreview(false);
          startHole();
          setBusy(false);
          announce("Campo outra vez fechado. Boa sorte!");
        }

        function playChime(happy) {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audio = new AudioContext();
            const notes = happy ? [523.25, 659.25, 783.99] : [523.25, 587.33];
            notes.forEach((frequency, index) => {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, audio.currentTime + index * 0.12);
              gain.gain.linearRampToValueAtTime(0.12, audio.currentTime + index * 0.12 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + index * 0.12 + 0.4);
              oscillator.connect(gain).connect(audio.destination);
              oscillator.start(audio.currentTime + index * 0.12);
              oscillator.stop(audio.currentTime + index * 0.12 + 0.42);
            });
            window.setTimeout(() => audio.close(), 900);
          } catch (_) {
            // O som é um extra; o jogo joga-se todo sem ele.
          }
        }

        function build() {
          for (let index = 0; index < 9; index += 1) {
            const row = Math.floor(index / 3);
            const column = index % 3;
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.dataset.state = "grass";
            // A fotografia é a mesma em todas as casas; o que muda é o pedaço
            // que cada uma mostra — e esse sai das coordenadas dela.
            tile.style.backgroundImage = 'url("./assets/photo.jpg")';
            tile.style.backgroundRepeat = "no-repeat";
            tile.style.backgroundSize = "300% 300%";
            tile.style.backgroundPosition = `${column * 50}% ${row * 50}%`;
            tiles.push(tile);
            turf.appendChild(tile);
          }

          HOLES.forEach((item, index) => {
            const box = document.createElement("div");
            box.className = "score-box";
            box.innerHTML = `<span class="score-hole">${index + 1}</span><span class="score-strokes">–</span>`;
            boxes.push(box);
            scorecard.appendChild(box);
          });
          scorecard.setAttribute("aria-label", `Cartão de pontuação, par ${totalPar}`);
        }

        aimLeftButton.addEventListener("click", () => aim(-AIM_STEP));
        aimRightButton.addEventListener("click", () => aim(AIM_STEP));
        shootButton.addEventListener("click", shoot);
        restartButton.addEventListener("click", restart);
        previewButton.addEventListener("click", () => setPreview(!preview.classList.contains("visible")));
        power.addEventListener("input", () => {
          powerValue.textContent = power.value;
          drawAim();
        });
        playAgainButton.addEventListener("click", () => {
          restart();
          shootButton.focus();
        });
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) hideCelebration();
        });

        document.addEventListener("keydown", (event) => {
          const keys = {
            ArrowLeft: () => aim(-AIM_STEP),
            ArrowRight: () => aim(AIM_STEP),
            ArrowUp: () => setPower(Number(power.value) + 5),
            ArrowDown: () => setPower(Number(power.value) - 5),
            Escape: () => { setPreview(false); hideCelebration(); },
          };
          const action = keys[event.key];
          if (action) {
            event.preventDefault();
            action();
            return;
          }
          // A barra de espaços bate a bola — excepto se estiver a carregar num botão.
          if (event.key === " " && !event.target.closest?.("button, input")) {
            event.preventDefault();
            shoot();
          }
        });

        function setPower(value) {
          power.value = String(Math.min(100, Math.max(10, value)));
          powerValue.textContent = power.value;
          drawAim();
        }

        /*
         * No telemóvel joga-se como no minigolfe a sério: puxa-se a bola para
         * trás e larga-se. O lado para onde se puxa é o contrário do lado para
         * onde ela sai, e quanto mais longe se puxa, mais forte é a tacada.
         */
        let drag = null;

        function pointAt(event) {
          const rect = green.getBoundingClientRect();
          if (!rect.width) return null;
          return {
            x: ((event.clientX - rect.left) / rect.width) * 100,
            y: ((event.clientY - rect.top) / rect.height) * 100,
            reach: 45,
          };
        }

        green.addEventListener("pointerdown", (event) => {
          if (busy || solved) return;
          const point = pointAt(event);
          if (!point) return;
          drag = point;
          green.setPointerCapture?.(event.pointerId);
        });

        green.addEventListener("pointermove", (event) => {
          if (!drag) return;
          const point = pointAt(event);
          if (!point) return;
          const dx = drag.x - point.x;
          const dy = drag.y - point.y;
          const pulled = Math.hypot(dx, dy);
          if (pulled < 3) return;
          drag.pulled = true;
          angle = ((Math.round(((Math.atan2(dy, dx) * 180) / Math.PI) / AIM_STEP) * AIM_STEP) + 360) % 360;
          setPower(Math.round(10 + (Math.min(pulled, drag.reach) / drag.reach) * 90));
        });

        green.addEventListener("pointerup", (event) => {
          if (!drag) return;
          const pulled = drag.pulled;
          drag = null;
          green.releasePointerCapture?.(event.pointerId);
          // Um toque perdido não bate a bola: só bate quem a puxou mesmo para trás.
          if (pulled) shoot();
        });

        green.addEventListener("pointercancel", () => { drag = null; });

        build();
        restart();
      })();
    </script>
  </body>
</html>
