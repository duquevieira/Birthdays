<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:image" content="https://duquevieira.github.io/Birthdays/puzzles/catarina-brito/assets/og-image.jpg" />

    <title>Parabéns, Catarina! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap");

      /*
       * As cores são as do tangram de madeira: a moldura de carvalho, o teca do
       * fundo, o nogueira escuro das peças mais fundas e o ácer quase branco das
       * mais claras. O verde vem da camisola da fotografia.
       */
      :root {
        --ink: #3a2a1c;
        --muted: #8a7660;
        --teak: #8a6238;
        --teak-dark: #6b431f;
        --walnut: #5a3a1e;
        --oak: #c69c6b;
        --oak-light: #d9b98a;
        --maple: #f0dfc2;
        --olive: #55613a;
        --cream: #faf3e7;
        --card: linear-gradient(168deg, #fdf7ec 0%, #f3e6d0 100%);
        --shadow: 0 26px 70px rgba(74, 48, 24, 0.24);
        /* A prateleira das peças cresce com o ecrã, mas nunca passa disto. */
        --set-size: clamp(74px, 21vw, 96px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #e5d5bb;
      }

      /* O fundo é a parede clara por trás do quadro de madeira da fotografia. */
      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.95) 0 5%, transparent 22%),
          radial-gradient(circle at 92% 16%, rgba(138, 98, 56, 0.16) 0 8%, transparent 28%),
          linear-gradient(155deg, #fdf7ec 0%, #f1e2ca 48%, #e2cfae 100%);
        background-attachment: fixed;
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        /* minmax(0, 1fr): a fila de peças é larga e não pode esticar a página. */
        grid-template-columns: minmax(0, 1fr);
        min-height: 100svh;
        place-items: center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      .page-shell::before,
      .page-shell::after {
        position: fixed;
        z-index: -1;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(138, 98, 56, 0.14);
        border-radius: 50%;
        content: "";
      }

      .page-shell::before {
        top: -115px;
        left: -92px;
        box-shadow: 0 0 0 34px rgba(138, 98, 56, 0.06), 0 0 0 68px rgba(138, 98, 56, 0.04);
      }

      .page-shell::after {
        right: -130px;
        bottom: -100px;
        box-shadow: 0 0 0 40px rgba(85, 97, 58, 0.07), 0 0 0 80px rgba(85, 97, 58, 0.04);
      }

      .confetti-piece {
        position: fixed;
        z-index: -1;
        width: 8px;
        height: 18px;
        border-radius: 6px;
        opacity: 0.5;
        transform: rotate(var(--rotate));
      }

      .confetti-piece:nth-child(1) { top: 8%; left: 7%; background: var(--teak); --rotate: 25deg; }
      .confetti-piece:nth-child(2) { top: 19%; right: 8%; width: 11px; height: 11px; background: var(--olive); --rotate: 45deg; }
      .confetti-piece:nth-child(3) { top: 52%; left: 4%; background: var(--oak-light); --rotate: -25deg; }
      .confetti-piece:nth-child(4) { right: 5%; bottom: 18%; background: var(--teak-dark); --rotate: 65deg; }

      main {
        width: min(100%, 470px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 0 0 8px;
        color: var(--teak);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.45;
      }

      h1 {
        max-width: 400px;
        margin: 0 auto 20px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.35rem, 11vw, 4.2rem);
        line-height: 0.94;
        text-align: center;
        letter-spacing: -0.045em;
      }

      h1 em {
        color: var(--teak);
        font-weight: 700;
      }

      .game-card {
        padding: clamp(12px, 3.5vw, 18px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 26px;
        background: var(--card);
        box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin: 2px 3px 13px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .stat:last-child {
        justify-content: flex-end;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .stat-value {
        min-width: 1.6ch;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.35rem;
        font-variant-numeric: tabular-nums;
      }

      .level-badge {
        padding: 7px 11px;
        border: 1px solid rgba(138, 98, 56, 0.35);
        border-radius: 999px;
        color: var(--teak-dark);
        background: rgba(138, 98, 56, 0.1);
        font-size: 0.7rem;
        font-weight: 700;
        white-space: nowrap;
      }

      /* ---------- A moldura e o tabuleiro ---------- */

      /*
       * A moldura é a do tangram de madeira: quatro tábuas de carvalho com o veio
       * à vista, um bisel claro por dentro e a sombra do quadro na parede.
       */
      .frame {
        position: relative;
        padding: clamp(11px, 3.6vw, 20px);
        border-radius: 8px;
        background:
          repeating-linear-gradient(97deg, rgba(255, 255, 255, 0.055) 0 2px, rgba(60, 34, 12, 0.06) 2px 6px),
          linear-gradient(152deg, #c19a68 0%, #a67f4f 34%, #8a6238 68%, #a8814f 100%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 240, 214, 0.32),
          inset 0 2px 3px rgba(255, 240, 214, 0.28),
          inset 0 -3px 6px rgba(50, 28, 8, 0.3),
          0 18px 40px rgba(74, 48, 24, 0.32);
      }

      /* O fundo da caixa: madeira mais escura, vista lá do fundo do encaixe. */
      .board-wrap {
        position: relative;
        aspect-ratio: 1;
        border-radius: 3px;
        background:
          repeating-linear-gradient(88deg, rgba(255, 255, 255, 0.04) 0 3px, rgba(40, 22, 6, 0.05) 3px 7px),
          linear-gradient(160deg, #7d5731 0%, #6b4526 55%, #7a5430 100%);
        box-shadow:
          inset 0 3px 10px rgba(35, 18, 4, 0.55),
          inset 0 0 0 1px rgba(35, 18, 4, 0.4);
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .board {
        position: absolute;
        inset: 0;
        /* As peças assentes transbordam um fio (ver GROW); a caixa apara-o. */
        overflow: hidden;
      }

      /* O desenho gravado no fundo da caixa, que diz onde cada peça assenta. */
      .engraving {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transition: opacity 700ms ease;
      }

      .engraving path {
        fill: none;
        stroke: rgba(255, 236, 205, 0.24);
        stroke-width: 1.2;
        vector-effect: non-scaling-stroke;
      }

      .board.is-solved .engraving {
        opacity: 0;
      }

      /*
       * Cada lugar é um botão que ocupa a caixa toda e é recortado com a forma da
       * peça — o recorte trata do desenho e também de saber onde é que o dedo caiu.
       */
      .slot {
        position: absolute;
        inset: 0;
        padding: 0;
        border: 0;
        background: rgba(255, 236, 205, 0.05);
        cursor: pointer;
        transition: background 140ms ease;
      }

      .slot:hover:not(.is-filled) {
        background: rgba(255, 236, 205, 0.14);
      }

      /* Enquanto há uma peça na mão, os lugares livres saltam à vista. */
      .board.is-armed .slot:not(.is-filled) {
        background: rgba(255, 236, 205, 0.16);
      }

      .slot.is-filled {
        background: none;
        cursor: default;
        pointer-events: none;
      }

      .slot.is-wrong {
        animation: shake 380ms ease;
        background: rgba(158, 62, 40, 0.35);
      }

      .placed-piece {
        position: absolute;
        inset: 0;
        pointer-events: none;
        animation: snap 340ms cubic-bezier(0.22, 0.9, 0.3, 1.1);
      }

      .outline {
        transition: stroke 700ms ease;
      }

      /* No fim, os cortes desaparecem e fica só a fotografia. */
      .board.is-solved .outline {
        stroke: transparent;
      }

      .board-preview {
        position: absolute;
        inset: 0;
        z-index: 4;
        border-radius: 2px;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        opacity: 0;
        pointer-events: none;
        transform: scale(1.025);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .board-preview.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* ---------- As peças por pôr ---------- */

      /*
       * As peças ficam pousadas numa tábua, ao lado da caixa, tortas como ficam
       * numa mesa. São só sete: cabem todas à vista, em duas ou três filas,
       * sem ser preciso deslizar a tábua para as encontrar.
       */
      .tray {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px 14px;
        min-height: calc(var(--set-size) + 26px);
        margin-top: 13px;
        padding: 14px 12px;
        border-radius: 10px;
        background:
          repeating-linear-gradient(93deg, rgba(255, 255, 255, 0.05) 0 2px, rgba(40, 22, 6, 0.05) 2px 6px),
          linear-gradient(#8d6238, #6d4623);
        box-shadow: inset 0 5px 14px rgba(35, 18, 4, 0.42), inset 0 0 0 1px rgba(255, 236, 205, 0.16);
      }

      .tray:empty {
        display: grid;
        place-items: center;
      }

      .tray:empty::after {
        color: rgba(255, 236, 205, 0.9);
        font-size: 0.8rem;
        content: "Já não há peças na tábua. 🎬";
      }

      /*
       * Cada peça guarda o seu tamanho verdadeiro: --w e --h são a fração do
       * quadrado que ela ocupa, por isso o triângulo grande é mesmo o dobro do médio.
       */
      .piece {
        flex: 0 0 auto;
        width: calc(var(--set-size) * var(--w));
        height: calc(var(--set-size) * var(--h));
        padding: 0;
        border: 0;
        background: none;
        cursor: grab;
        filter: drop-shadow(0 3px 4px rgba(35, 18, 4, 0.5));
        transform: rotate(var(--tilt, 0deg));
        transition: transform 160ms ease, filter 160ms ease;
        /* O dedo em cima da peça arrasta-a; ao lado dela, corre a página. */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .piece:hover {
        transform: rotate(var(--tilt, 0deg)) scale(1.05);
      }

      .piece.is-selected {
        filter: drop-shadow(0 0 3px rgba(255, 236, 205, 0.95)) drop-shadow(0 6px 9px rgba(35, 18, 4, 0.5));
        transform: rotate(var(--tilt, 0deg)) scale(1.1);
      }

      .piece.is-dragging {
        opacity: 0.3;
      }

      .drag-ghost {
        position: fixed;
        z-index: 30;
        width: calc(var(--set-size) * var(--w) * 1.15);
        height: calc(var(--set-size) * var(--h) * 1.15);
        filter: drop-shadow(0 0 4px rgba(255, 236, 205, 0.85)) drop-shadow(0 12px 14px rgba(35, 18, 4, 0.5));
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .piece svg,
      .placed-piece svg,
      .drag-ghost svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .controls {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 10px;
        margin-top: 13px;
      }

      .control-button,
      .celebration-button {
        min-height: 50px;
        border: 1px solid rgba(138, 98, 56, 0.5);
        border-radius: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 130ms ease, box-shadow 130ms ease, background 130ms ease;
      }

      .control-button:active,
      .celebration-button:active {
        transform: translateY(2px);
      }

      .control-button.primary,
      .celebration-button {
        color: var(--cream);
        background: linear-gradient(#9a7043, var(--teak-dark));
        box-shadow: 0 8px 18px rgba(74, 48, 24, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .control-button.primary:hover,
      .celebration-button:hover {
        background: linear-gradient(#a97c4c, #5b3818);
      }

      .control-button.secondary {
        color: var(--ink);
        background: linear-gradient(#f4e7d0, #e7d5b6);
      }

      .piece:focus-visible,
      .slot:focus-visible,
      .control-button:focus-visible,
      .celebration-button:focus-visible {
        outline: 3px solid var(--olive);
        outline-offset: 3px;
      }

      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 13px 0 1px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
      }

      .hint-icon {
        display: grid;
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        place-items: center;
        border: 1px solid rgba(138, 98, 56, 0.45);
        border-radius: 50%;
        font-size: 0.68rem;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(58, 36, 16, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
        backdrop-filter: blur(9px);
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 390px);
        padding: 30px 24px 24px;
        overflow: hidden;
        border-radius: 26px;
        background: var(--cream);
        box-shadow: 0 28px 80px rgba(58, 34, 18, 0.34);
        text-align: center;
        transform: translateY(18px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card {
        transform: translateY(0) scale(1);
      }

      .celebration-emoji {
        display: block;
        margin-bottom: 8px;
        font-size: 2.5rem;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .celebration h2 {
        margin: 0;
        color: var(--teak);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 10vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .celebration p {
        margin: 14px auto 20px;
        color: var(--muted);
        line-height: 1.55;
      }

      .celebration-button {
        width: 100%;
      }

      .burst {
        position: absolute;
        width: 10px;
        height: 26px;
        border-radius: 10px;
        animation: rain 1.8s ease-in infinite;
      }

      .burst:nth-child(1) { top: -28px; left: 10%; background: var(--teak); animation-delay: -0.3s; }
      .burst:nth-child(2) { top: -28px; left: 29%; background: var(--oak-light); animation-delay: -1.1s; }
      .burst:nth-child(3) { top: -28px; left: 51%; background: var(--olive); animation-delay: -0.7s; }
      .burst:nth-child(4) { top: -28px; right: 26%; background: var(--maple); animation-delay: -1.5s; }
      .burst:nth-child(5) { top: -28px; right: 8%; background: var(--teak-dark); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes bounce {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-6px); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(390px) rotate(260deg); }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-3px); }
      }

      @keyframes snap {
        from { opacity: 0.75; transform: scale(1.1); }
        to { opacity: 1; transform: scale(1); }
      }

      @media (max-height: 780px) and (orientation: portrait) {
        :root { --set-size: clamp(60px, 17vw, 78px); }
        .page-shell { padding-top: 12px; padding-bottom: 14px; }
        .eyebrow { margin-bottom: 5px; }
        h1 { margin-bottom: 11px; font-size: 2.2rem; }
        .game-card { padding: 11px; border-radius: 22px; }
        .scoreboard { margin-bottom: 8px; }
        .tray { margin-top: 9px; }
        .controls { margin-top: 9px; }
        .control-button { min-height: 44px; }
        .hint { margin-top: 8px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 38px; }
        h1 { margin-bottom: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>

      <main>
        <p class="eyebrow">Um dia muito especial</p>
        <h1>Parabéns, <em>Catarina!</em></h1>

        <section class="game-card" aria-label="Puzzle de aniversário">
          <div class="scoreboard" aria-live="polite">
            <div class="stat">
              <span class="stat-label">Peças</span>
              <span class="stat-value" id="placedCount">0/7</span>
            </div>
            <span class="level-badge">Tangram</span>
            <div class="stat">
              <span class="stat-label">Tempo</span>
              <span class="stat-value" id="timer">0:00</span>
            </div>
          </div>

          <div class="frame">
            <div class="board-wrap" id="boardWrap">
              <div class="board" id="board" role="group" aria-label="Caixa do tangram"></div>
              <div class="board-preview" id="preview" aria-hidden="true"></div>
            </div>
          </div>

          <div class="tray" id="tray" role="group" aria-label="Peças por pôr"></div>

          <div class="controls">
            <button class="control-button primary" id="shuffleButton" type="button">Baralhar as peças</button>
            <button class="control-button secondary" id="previewButton" type="button" aria-pressed="false">Ver fotografia</button>
          </div>
          <p class="hint"><span class="hint-icon" aria-hidden="true">✥</span>Arrasta a peça para o lugar dela — ou toca na peça e depois no lugar.</p>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <span class="celebration-emoji" aria-hidden="true">🎬</span>
        <h2 id="celebrationTitle">Está feito!</h2>
        <p id="celebrationText">Muitos parabéns, Catarina! Que este novo ano te traga histórias bonitas para contar, tempo para as viver e muitos motivos para sorrir.</p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        // Tudo o que muda de puzzle para puzzle vive aqui.
        const PUZZLE = {
          name: "Catarina",
          wish: "Que este novo ano te traga histórias bonitas para contar, tempo para as viver e muitos motivos para sorrir.",
          photo: "./assets/photo.jpg",
        };

        /*
         * O tangram de sempre, desenhado num quadrado de 4 × 4 unidades.
         *
         * São sete peças e sete áreas: 4 + 4 + 2 + 1 + 2 + 2 + 1 = 16, o quadrado
         * inteiro. Todos os cantos caem em meias unidades, por isso as peças
         * encostam umas às outras sem folgas nem sobreposições — é isso que faz
         * com que a fotografia, recortada por elas, volte a ficar inteira.
         */
        const UNIT = 4;
        const PIECES = [
          { key: "grande-cima", label: "triângulo grande de cima", points: [[0, 0], [4, 0], [2, 2]] },
          { key: "grande-esquerda", label: "triângulo grande da esquerda", points: [[0, 0], [2, 2], [0, 4]] },
          { key: "medio", label: "triângulo médio", points: [[4, 2], [4, 4], [2, 4]] },
          { key: "pequeno-canto", label: "triângulo pequeno do canto", points: [[4, 0], [4, 2], [3, 1]] },
          { key: "quadrado", label: "quadrado", points: [[3, 1], [4, 2], [3, 3], [2, 2]] },
          { key: "paralelogramo", label: "paralelogramo", points: [[3, 3], [2, 4], [0, 4], [1, 3]] },
          { key: "pequeno-meio", label: "triângulo pequeno do meio", points: [[2, 2], [3, 3], [1, 3]] },
        ];
        const TOTAL = PIECES.length;
        const TILTS = [-18, -11, -5, 6, 13, 21];   // as peças ficam tortas na tábua
        /*
         * Cortadas ao milímetro, as peças assentes deixavam ver um fio do fundo
         * escuro entre elas — é como o ecrã desenha duas arestas que se tocam.
         * Na caixa, cada peça cresce este bocadinho a partir do seu centro e passa
         * a encavalitar-se na vizinha. Como a fotografia entra sempre inteira e no
         * mesmo sítio, o que a peça mostra a mais é exactamente o que a vizinha ali
         * tinha: o fio desaparece e ninguém dá pela diferença.
         */
        const GROW = 1.015;
        const SVG_NS = "http://www.w3.org/2000/svg";
        const XLINK_NS = "http://www.w3.org/1999/xlink";

        const board = document.querySelector("#board");
        const tray = document.querySelector("#tray");
        const placedCount = document.querySelector("#placedCount");
        const timer = document.querySelector("#timer");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const previewButton = document.querySelector("#previewButton");
        const shuffleButton = document.querySelector("#shuffleButton");
        const celebration = document.querySelector("#celebration");
        const celebrationText = document.querySelector("#celebrationText");
        const playAgainButton = document.querySelector("#playAgainButton");

        let placed = 0;
        let attempts = 0;
        let seconds = 0;
        let timerId = null;
        let gameStarted = false;
        let solved = false;
        let selected = null;        // número da peça que está na mão, ou null
        let drag = null;
        const slots = new Map();    // número da peça → o seu lugar na caixa

        /** O rectângulo mais pequeno que contém a peça, em unidades do quadrado. */
        function boundingBox(points) {
          const xs = points.map(([x]) => x);
          const ys = points.map(([, y]) => y);
          const x = Math.min(...xs);
          const y = Math.min(...ys);
          return { x, y, width: Math.max(...xs) - x, height: Math.max(...ys) - y };
        }

        const pathOf = (points) => `M ${points.map(([x, y]) => `${x} ${y}`).join(" L ")} Z`;

        /** A mesma peça, um bocadinho maior, crescida a partir do seu centro. */
        function grown(points) {
          const centreX = points.reduce((sum, [x]) => sum + x, 0) / points.length;
          const centreY = points.reduce((sum, [, y]) => sum + y, 0) / points.length;
          return points.map(([x, y]) => [
            centreX + (x - centreX) * GROW,
            centreY + (y - centreY) * GROW,
          ]);
        }

        /** O mesmo contorno, em percentagem, para recortar o botão do lugar. */
        const polygonOf = (points) =>
          `polygon(${points.map(([x, y]) => `${(x * 100) / UNIT}% ${(y * 100) / UNIT}%`).join(", ")})`;

        /**
         * A peça desenhada. A fotografia entra sempre inteira e no mesmo sítio
         * (0 0 4 4) — o que muda é a janela por onde se olha: na caixa vê-se o
         * quadrado todo, na tábua vê-se só o rectângulo desta peça. É por isso que
         * as peças, ao serem postas, casam ao milímetro umas com as outras.
         */
        function createPieceSvg(piece, mode) {
          const { points } = PIECES[piece];
          const onBoard = mode === "board";
          const clipId = `${mode}-clip-${PIECES[piece].key}`;
          const shape = pathOf(onBoard ? grown(points) : points);
          const window_ = onBoard ? { x: 0, y: 0, width: UNIT, height: UNIT } : boundingBox(points);

          const svg = document.createElementNS(SVG_NS, "svg");
          svg.setAttribute("viewBox", `${window_.x} ${window_.y} ${window_.width} ${window_.height}`);
          svg.setAttribute("preserveAspectRatio", "none");
          svg.setAttribute("aria-hidden", "true");

          const defs = document.createElementNS(SVG_NS, "defs");
          const clip = document.createElementNS(SVG_NS, "clipPath");
          clip.setAttribute("id", clipId);
          const clipShape = document.createElementNS(SVG_NS, "path");
          clipShape.setAttribute("d", shape);
          clip.appendChild(clipShape);
          defs.appendChild(clip);

          const image = document.createElementNS(SVG_NS, "image");
          image.setAttribute("x", "0");
          image.setAttribute("y", "0");
          image.setAttribute("width", String(UNIT));
          image.setAttribute("height", String(UNIT));
          image.setAttribute("preserveAspectRatio", "none");
          image.setAttribute("clip-path", `url(#${clipId})`);
          image.setAttribute("href", PUZZLE.photo);
          image.setAttributeNS(XLINK_NS, "xlink:href", PUZZLE.photo);

          // O corte da serra: um fio claro à volta da peça, como na madeira.
          const outline = document.createElementNS(SVG_NS, "path");
          outline.setAttribute("class", "outline");
          outline.setAttribute("d", shape);
          outline.setAttribute("fill", "none");
          outline.setAttribute("stroke", "rgba(255, 240, 214, 0.55)");
          outline.setAttribute("stroke-width", "1.4");
          outline.setAttribute("stroke-linejoin", "round");
          outline.setAttribute("vector-effect", "non-scaling-stroke");

          svg.append(defs, image, outline);
          return svg;
        }

        function formatTime(value) {
          const minutes = Math.floor(value / 60);
          return `${minutes}:${String(value % 60).padStart(2, "0")}`;
        }

        function updateStats() {
          placedCount.textContent = `${placed}/${TOTAL}`;
          timer.textContent = formatTime(seconds);
        }

        function startTimer() {
          if (timerId || solved) return;
          timerId = window.setInterval(() => {
            seconds += 1;
            updateStats();
          }, 1000);
        }

        function stopTimer() {
          window.clearInterval(timerId);
          timerId = null;
        }

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        function shuffled(list) {
          const copy = list.slice();
          for (let index = copy.length - 1; index > 0; index -= 1) {
            const other = Math.floor(Math.random() * (index + 1));
            [copy[index], copy[other]] = [copy[other], copy[index]];
          }
          return copy;
        }

        function buildBoard() {
          board.textContent = "";
          slots.clear();

          // Primeiro o desenho gravado no fundo, por baixo de tudo.
          const engraving = document.createElementNS(SVG_NS, "svg");
          engraving.setAttribute("class", "engraving");
          engraving.setAttribute("viewBox", `0 0 ${UNIT} ${UNIT}`);
          engraving.setAttribute("preserveAspectRatio", "none");
          engraving.setAttribute("aria-hidden", "true");
          PIECES.forEach(({ points }) => {
            const line = document.createElementNS(SVG_NS, "path");
            line.setAttribute("d", pathOf(points));
            engraving.appendChild(line);
          });
          board.appendChild(engraving);

          PIECES.forEach(({ label, points }, piece) => {
            const slot = document.createElement("button");
            slot.type = "button";
            slot.className = "slot";
            slot.dataset.slot = String(piece);
            slot.style.clipPath = polygonOf(points);
            slot.setAttribute("aria-label", `Lugar do ${label}`);
            slot.addEventListener("click", () => dropOn(piece));
            slots.set(piece, slot);
            board.appendChild(slot);
          });
        }

        function buildTray() {
          tray.textContent = "";
          shuffled(PIECES.map((_, piece) => piece)).forEach((piece) => {
            const { label, points } = PIECES[piece];
            const box = boundingBox(points);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "piece";
            button.dataset.piece = String(piece);
            // --w e --h guardam o tamanho verdadeiro da peça, em fracções do quadrado.
            button.style.setProperty("--w", String(box.width / UNIT));
            button.style.setProperty("--h", String(box.height / UNIT));
            button.style.setProperty("--tilt", `${TILTS[Math.floor(Math.random() * TILTS.length)]}deg`);
            button.setAttribute("aria-pressed", "false");
            button.setAttribute("aria-label", `Peça: ${label}`);
            button.appendChild(createPieceSvg(piece, "tray"));
            button.addEventListener("click", () => selectPiece(piece));
            tray.appendChild(button);
          });
        }

        function selectPiece(piece) {
          if (solved) return;
          selected = selected === piece ? null : piece;
          tray.querySelectorAll(".piece").forEach((button) => {
            const isSelected = Number(button.dataset.piece) === selected;
            button.classList.toggle("is-selected", isSelected);
            button.setAttribute("aria-pressed", String(isSelected));
          });
          board.classList.toggle("is-armed", selected !== null);
          announce(selected === null ? "Peça pousada." : "Peça na mão. Agora toca no lugar dela.");
        }

        /** Tenta pôr a peça que está na mão no lugar `slotNumber`. */
        function dropOn(slotNumber) {
          if (solved || selected === null) {
            if (!solved) announce("Escolhe primeiro uma peça.");
            return false;
          }
          if (slots.get(slotNumber).classList.contains("is-filled")) return false;

          if (!gameStarted) {
            gameStarted = true;
            startTimer();
          }

          attempts += 1;

          if (slotNumber !== selected) {
            const slot = slots.get(slotNumber);
            slot.classList.add("is-wrong");
            window.setTimeout(() => slot.classList.remove("is-wrong"), 400);
            announce("Essa peça não é para aqui. Tenta outro lugar.");
            return false;
          }

          placePiece(selected);
          return true;
        }

        function placePiece(piece) {
          tray.querySelector(`[data-piece="${piece}"]`)?.remove();

          const holder = document.createElement("div");
          holder.className = "placed-piece";
          holder.dataset.placed = String(piece);
          holder.appendChild(createPieceSvg(piece, "board"));
          board.appendChild(holder);

          const slot = slots.get(piece);
          slot.classList.add("is-filled");
          slot.disabled = true;
          slot.setAttribute("aria-label", `${PIECES[piece].label}: já está no lugar`);

          selected = null;
          board.classList.remove("is-armed");
          placed += 1;
          updateStats();
          playClick();

          if (placed === TOTAL) completeGame();
          else announce(`Assentou! Faltam ${TOTAL - placed} peças.`);
        }

        function completeGame() {
          solved = true;
          stopTimer();
          board.classList.add("is-solved");
          celebrationText.textContent = `Fizeste o tangram em ${attempts} ${attempts === 1 ? "tentativa" : "tentativas"} e ${formatTime(seconds)}. Muitos parabéns, ${PUZZLE.name}! ${PUZZLE.wish}`;
          announce("Tangram completo. Parabéns!");
          window.setTimeout(showCelebration, 650);
          playChime();
        }

        function showCelebration() {
          celebration.classList.add("visible");
          celebration.setAttribute("aria-hidden", "false");
          playAgainButton.focus();
        }

        function hideCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        function setPreview(visible) {
          preview.classList.toggle("visible", visible);
          previewButton.setAttribute("aria-pressed", String(visible));
          previewButton.textContent = visible ? "Voltar ao puzzle" : "Ver fotografia";
        }

        function newGame() {
          hideCelebration();
          stopTimer();
          setPreview(false);
          solved = false;
          gameStarted = false;
          selected = null;
          board.classList.remove("is-solved");
          board.classList.remove("is-armed");
          placed = 0;
          attempts = 0;
          seconds = 0;
          buildBoard();
          buildTray();
          updateStats();
          announce("As peças foram baralhadas. Boa sorte!");
        }

        /* ---------- Arrastar as peças ---------- */

        tray.addEventListener("pointerdown", (event) => {
          const button = event.target.closest?.(".piece");
          if (!button || solved) return;
          const piece = Number(button.dataset.piece);
          if (selected !== piece) selectPiece(piece);

          const ghost = document.createElement("div");
          ghost.className = "drag-ghost";
          ghost.style.setProperty("--w", button.style.getPropertyValue("--w"));
          ghost.style.setProperty("--h", button.style.getPropertyValue("--h"));
          ghost.appendChild(createPieceSvg(piece, "ghost"));
          document.body.appendChild(ghost);
          button.classList.add("is-dragging");
          drag = { ghost, button, moved: false };
          moveGhost(event);
        });

        function moveGhost(event) {
          if (!drag) return;
          drag.ghost.style.left = `${event.clientX}px`;
          drag.ghost.style.top = `${event.clientY}px`;
        }

        function stopDrag() {
          if (!drag) return null;
          const finished = drag;
          finished.ghost.remove();
          finished.button.classList.remove("is-dragging");
          drag = null;
          return finished;
        }

        document.addEventListener("pointermove", (event) => {
          if (!drag) return;
          drag.moved = true;
          moveGhost(event);
        });

        document.addEventListener("pointerup", (event) => {
          const finished = stopDrag();
          if (!finished || !finished.moved) return;   // toque simples: a peça fica só na mão
          const target = document.elementFromPoint?.(event.clientX, event.clientY);
          const slot = target?.closest?.(".slot");
          if (slot) dropOn(Number(slot.dataset.slot));
        });

        document.addEventListener("pointercancel", stopDrag);

        /* ---------- Sons ---------- */

        function tone(frequencies, volume) {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audio = new AudioContext();
            frequencies.forEach((frequency, index) => {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, audio.currentTime + index * 0.12);
              gain.gain.linearRampToValueAtTime(volume, audio.currentTime + index * 0.12 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + index * 0.12 + 0.4);
              oscillator.connect(gain).connect(audio.destination);
              oscillator.start(audio.currentTime + index * 0.12);
              oscillator.stop(audio.currentTime + index * 0.12 + 0.42);
            });
            window.setTimeout(() => audio.close(), 900);
          } catch (_) {
            // O som é um extra; o jogo funciona na mesma sem ele.
          }
        }

        const playClick = () => tone([880], 0.05);
        const playChime = () => tone([523.25, 659.25, 783.99], 0.12);

        /* ---------- Ligações ---------- */

        shuffleButton.addEventListener("click", newGame);
        previewButton.addEventListener("click", () => setPreview(!preview.classList.contains("visible")));
        playAgainButton.addEventListener("click", () => {
          newGame();
          shuffleButton.focus();
        });
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) hideCelebration();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          setPreview(false);
          hideCelebration();
          if (selected !== null) selectPiece(selected);
        });

        newGame();
      })();
    </script>
  </body>
</html>
