    <title>Parabéns, Manuel Gomes! 🎂</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap");

      /*
       * As cores saem todas da fotografia: o azul do polo, o azul-escuro do saco,
       * o caqui das calças, o verde da bola do emblema — e o verde do relvado,
       * que é o único que a fotografia não tinha.
       */
      :root {
        --ink: #2f3138;
        --muted: #7a7d86;
        --sky: #2f6fb3;
        --sky-dark: #22507f;
        --sand: #c8a878;
        --turquoise: #2f9fbe;
        --grass: #4ea36a;
        --grass-dark: #3a7f52;
        --cream: #fdfaf3;
        --paper: rgba(255, 255, 255, 0.86);
        --tile-gap: clamp(2px, 0.7vw, 4px);
        --shadow: 0 24px 70px rgba(51, 48, 42, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #cfe0f2;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        font-family: "DM Sans", system-ui, sans-serif;
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.95) 0 5%, transparent 20%),
          radial-gradient(circle at 92% 18%, rgba(216, 180, 119, 0.3) 0 8%, transparent 27%),
          linear-gradient(155deg, #fdfaf3 0%, #f3e3c6 48%, #cfe0f2 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
        isolation: isolate;
      }

      .page-shell::before,
      .page-shell::after {
        position: fixed;
        z-index: -1;
        width: 220px;
        height: 220px;
        border: 1px solid rgba(31, 95, 168, 0.16);
        border-radius: 50%;
        content: "";
      }

      .page-shell::before {
        top: -115px;
        left: -92px;
        box-shadow: 0 0 0 34px rgba(31, 95, 168, 0.07), 0 0 0 68px rgba(31, 95, 168, 0.04);
      }

      .page-shell::after {
        right: -130px;
        bottom: -100px;
        box-shadow: 0 0 0 40px rgba(216, 180, 119, 0.14), 0 0 0 80px rgba(216, 180, 119, 0.08);
      }

      .confetti-piece {
        position: fixed;
        z-index: -1;
        width: 8px;
        height: 18px;
        border-radius: 6px;
        opacity: 0.5;
        transform: rotate(var(--rotate));
      }

      .confetti-piece:nth-child(1) { top: 8%; left: 7%; background: var(--sky); --rotate: 25deg; }
      .confetti-piece:nth-child(2) { top: 19%; right: 8%; width: 11px; height: 11px; background: var(--sand); --rotate: 45deg; }
      .confetti-piece:nth-child(3) { top: 52%; left: 4%; background: var(--turquoise); --rotate: -25deg; }
      .confetti-piece:nth-child(4) { right: 5%; bottom: 18%; background: var(--grass); --rotate: 65deg; }

      main {
        width: min(100%, 470px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 0 0 6px;
        color: var(--sky);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.45;
      }

      h1 {
        max-width: 390px;
        margin: 0 auto 14px;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.1rem, 9.5vw, 3.6rem);
        line-height: 0.94;
        text-align: center;
        letter-spacing: -0.045em;
      }

      h1 em {
        color: var(--sky);
        font-weight: 700;
      }

      .game-card {
        padding: clamp(10px, 3vw, 16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        background: var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        margin: 2px 3px 11px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .stat:last-child {
        justify-content: flex-end;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .stat-value {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.35rem;
        font-variant-numeric: tabular-nums;
      }

      .stat-goal {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .hole-badge {
        padding: 7px 11px;
        border-radius: 999px;
        color: var(--sky-dark);
        background: rgba(31, 95, 168, 0.1);
        font-size: 0.7rem;
        font-weight: 700;
        white-space: nowrap;
      }

      /*
       * O campo é quadrado, tal como a fotografia, e é o mesmo sítio para as duas
       * coisas: por baixo está a fotografia, por cima o relvado que a tapa. Todas
       * as medidas do jogo vão de 0 a 100, por isso desenham-se em percentagem.
       */
      .green {
        position: relative;
        width: min(100%, 52svh, 400px);
        margin: 0 auto;
        overflow: hidden;
        border-radius: 18px;
        aspect-ratio: 1;
        background: #386241;
        box-shadow: inset 0 0 0 1px rgba(51, 48, 42, 0.12), 0 10px 26px rgba(51, 48, 42, 0.12);
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .green::before {
        position: absolute;
        inset: 0;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        content: "";
        opacity: 0.16;
      }

      .turf {
        position: absolute;
        z-index: 1;
        display: grid;
        inset: 0;
        gap: var(--tile-gap);
        padding: var(--tile-gap);
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(6, 1fr);
        transition: gap 400ms ease, padding 400ms ease;
      }

      .turf.solved {
        gap: 0;
        padding: 0;
      }

      /* Cada casa é uma janela para o seu pedaço da fotografia; o relvado é o que está por cima. */
      .tile {
        position: relative;
        border-radius: clamp(3px, 1.2vw, 7px);
        transition: border-radius 400ms ease;
      }

      .tile::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          repeating-linear-gradient(102deg, rgba(255, 255, 255, 0.07) 0 9px, transparent 9px 18px),
          linear-gradient(160deg, #63aa6b, #48874f);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        content: "";
        transition: opacity 500ms ease;
      }

      /* Buraco fechado: a fotografia aparece, com um resto de relva por cima. */
      .tile[data-state="open"]::after {
        opacity: 0.17;
      }

      .turf.solved .tile { border-radius: 0; }
      .turf.solved .tile::after { opacity: 0; }

      /* Fechada a volta, o campo sai de cima da fotografia e fica só ela. */
      .green[data-solved="1"] .hazard,
      .green[data-solved="1"] .cup,
      .green[data-solved="1"] .ball {
        opacity: 0;
        transition: opacity 600ms ease;
      }

      /* Cada obstáculo enche uma casa do tabuleiro, e é sempre a mesma medida. */
      .hazard {
        position: absolute;
        z-index: 2;
        width: calc(100% / 6);
        height: calc(100% / 6);
      }

      .hazard[data-kind="tree"]::before {
        position: absolute;
        inset: 11%;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 28%, #4f9a5f, #17421f);
        box-shadow: 0 3px 7px rgba(12, 24, 12, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.3);
        content: "";
      }

      .hazard[data-kind="sand"]::before {
        position: absolute;
        inset: 9%;
        border-radius: 26%;
        background: linear-gradient(160deg, rgba(240, 223, 192, 0.96), rgba(216, 180, 119, 0.96));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        content: "";
      }

      .hazard[data-kind="water"]::before {
        position: absolute;
        inset: 6%;
        border-radius: 20%;
        background: linear-gradient(160deg, rgba(59, 143, 208, 0.92), rgba(31, 95, 168, 0.94));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32);
        content: "";
      }

      .cup {
        position: absolute;
        z-index: 3;
        width: 10%;
        border-radius: 50%;
        aspect-ratio: 1;
        background: radial-gradient(circle at 50% 35%, #1b1814, #0d0c0a);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.8);
        transform: translate(-50%, -50%);
      }

      /* A bandeira sai do buraco para cima; é ela que se vê de longe. */
      .cup::before {
        position: absolute;
        bottom: 50%;
        left: 50%;
        width: 2px;
        height: 140%;
        background: rgba(255, 255, 255, 0.92);
        content: "";
      }

      .cup::after {
        position: absolute;
        bottom: 110%;
        left: 50%;
        width: 115%;
        height: 55%;
        background: var(--sky);
        clip-path: polygon(0 0, 100% 50%, 0 100%);
        content: "";
      }

      .ball {
        position: absolute;
        z-index: 5;
        width: 9%;
        transition: left 70ms linear, top 70ms linear;
        border-radius: 50%;
        aspect-ratio: 1;
        background: radial-gradient(circle at 34% 30%, #fff, #d9d5cc);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
        transform: translate(-50%, -50%);
      }

      .puzzle-preview {
        position: absolute;
        z-index: 6;
        inset: 0;
        background: url("./assets/photo.jpg") center / cover no-repeat;
        opacity: 0;
        pointer-events: none;
        transform: scale(1.025);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .puzzle-preview.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* O cartão de pontuação: nove casas, uma por buraco. */
      .scorecard {
        display: grid;
        gap: 4px;
        margin-top: 11px;
        grid-template-columns: repeat(9, 1fr);
      }

      .score-box {
        display: grid;
        padding: 4px 0 5px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: inset 0 0 0 1px rgba(47, 49, 56, 0.09);
        gap: 1px;
        text-align: center;
        transition: background 200ms ease, box-shadow 200ms ease;
      }

      .score-hole {
        color: var(--muted);
        font-size: 0.56rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      .score-strokes {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 0.95rem;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .score-box[data-result="playing"] {
        background: rgba(47, 111, 179, 0.12);
        box-shadow: inset 0 0 0 2px rgba(47, 111, 179, 0.4);
      }

      .score-box[data-result="under"] { background: rgba(78, 163, 106, 0.24); }
      .score-box[data-result="under"] .score-strokes { color: var(--grass-dark); }
      .score-box[data-result="par"] { background: rgba(47, 111, 179, 0.14); }
      .score-box[data-result="par"] .score-strokes { color: var(--sky-dark); }
      .score-box[data-result="over"] { background: rgba(200, 168, 120, 0.34); }

      /* As quatro setas: é só isto que o jogo pede aos dedos. */
      .pad {
        display: grid;
        gap: 8px;
        margin-top: 11px;
        grid-template-columns: repeat(4, 1fr);
      }

      .pad-button {
        display: grid;
        min-height: 50px;
        place-items: center;
        border: 0;
        border-radius: 15px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: inset 0 0 0 1px rgba(47, 49, 56, 0.1);
        font-size: 1.1rem;
        transition: transform 120ms ease, background 160ms ease;
      }

      .pad-button:active {
        transform: scale(0.96);
        background: rgba(255, 255, 255, 0.95);
      }

      .controls {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .control-button,
      .celebration-button {
        min-height: 46px;
        border: 0;
        border-radius: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 130ms ease, box-shadow 130ms ease, background 130ms ease;
      }

      .control-button:active,
      .celebration-button:active {
        transform: translateY(2px);
      }

      .control-button.primary,
      .celebration-button {
        color: white;
        background: var(--sky);
        box-shadow: 0 8px 18px rgba(31, 95, 168, 0.24);
      }

      .control-button.primary:hover,
      .celebration-button:hover {
        background: var(--sky-dark);
      }

      .control-button.secondary {
        color: var(--ink);
        background: #ede2cd;
      }

      .control-button[disabled],
      .pad-button[disabled] {
        box-shadow: none;
        opacity: 0.45;
        cursor: default;
      }

      .pad-button:focus-visible,
      .control-button:focus-visible,
      .celebration-button:focus-visible,
      .restart:focus-visible {
        outline: 3px solid var(--turquoise);
        outline-offset: 3px;
      }

      .footnote {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 10px 2px 1px;
      }

      .hint {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        color: var(--muted);
        font-size: 0.73rem;
      }

      .hint-icon {
        display: grid;
        width: 19px;
        height: 19px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid rgba(125, 114, 100, 0.34);
        border-radius: 50%;
        font-size: 0.68rem;
      }

      .restart {
        flex: 0 0 auto;
        padding: 5px 2px;
        border: 0;
        color: var(--muted);
        background: none;
        font-size: 0.73rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: underline;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(38, 45, 56, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
      }

      .celebration.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .celebration-card {
        position: relative;
        width: min(100%, 390px);
        padding: 30px 24px 24px;
        overflow: hidden;
        border-radius: 30px;
        background: var(--cream);
        box-shadow: 0 28px 80px rgba(30, 26, 20, 0.34);
        text-align: center;
        transform: translateY(18px) scale(0.96);
        transition: transform 320ms cubic-bezier(0.22, 0.8, 0.32, 1);
      }

      .celebration.visible .celebration-card {
        transform: translateY(0) scale(1);
      }

      /*
       * A fotografia inteira também vem para dentro do cartão: é ela o prémio, e
       * assim vê-se bem mesmo com a festa aberta por cima do campo.
       */
      .celebration-photo {
        position: relative;
        z-index: 1;
        display: block;
        height: 180px;
        margin: -30px -24px 10px;
        background: url("./assets/photo.jpg") center 6% / cover no-repeat;
        box-shadow: inset 0 -1px 0 rgba(51, 48, 42, 0.12);
      }

      .celebration-emoji {
        display: block;
        margin-bottom: 8px;
        font-size: 2.5rem;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .celebration h2 {
        margin: 0;
        color: var(--sky);
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2rem, 10vw, 3.25rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .celebration p {
        margin: 14px auto 20px;
        color: var(--muted);
        line-height: 1.55;
      }

      .celebration-button {
        width: 100%;
      }

      .burst {
        position: absolute;
        width: 10px;
        height: 26px;
        border-radius: 10px;
        animation: rain 1.8s ease-in infinite;
      }

      .burst:nth-child(1) { top: -28px; left: 10%; background: var(--sky); animation-delay: -0.3s; }
      .burst:nth-child(2) { top: -28px; left: 29%; background: var(--sand); animation-delay: -1.1s; }
      .burst:nth-child(3) { top: -28px; left: 51%; background: var(--turquoise); animation-delay: -0.7s; }
      .burst:nth-child(4) { top: -28px; right: 26%; background: var(--grass); animation-delay: -1.5s; }
      .burst:nth-child(5) { top: -28px; right: 8%; background: var(--sky); animation-delay: -0.9s; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes bounce {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-6px); }
      }

      @keyframes rain {
        from { transform: translateY(0) rotate(0); }
        to { transform: translateY(390px) rotate(260deg); }
      }

      @media (max-height: 720px) and (orientation: portrait) {
        .page-shell { padding-top: 10px; padding-bottom: 12px; }
        .eyebrow { margin-bottom: 4px; }
        h1 { margin-bottom: 9px; font-size: 2rem; }
        .game-card { padding: 10px; border-radius: 22px; }
        .scoreboard { margin-bottom: 8px; }
        .green { width: min(100%, 44svh, 400px); }
        .pad { margin-top: 8px; }
        .pad-button { min-height: 44px; }
        .footnote { margin-top: 7px; }
      }

      @media (min-width: 700px) {
        .page-shell { padding-block: 34px; }
        h1 { margin-bottom: 20px; }
        .green { width: min(100%, 60svh, 430px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>
      <span class="confetti-piece" aria-hidden="true"></span>

      <main>
        <p class="eyebrow">Um dia muito especial</p>
        <h1>Parabéns, <em>Manuel!</em></h1>

        <section class="game-card" aria-label="Golfe de aniversário">
          <div class="scoreboard" aria-live="polite">
            <div class="stat">
              <span class="stat-label">Buraco</span>
              <span class="stat-value" id="holeNumber">1</span>
              <span class="stat-goal" id="holeGoal">/9</span>
            </div>
            <span class="hole-badge" id="holeBadge">O primeiro · par 2</span>
            <div class="stat">
              <span class="stat-label">Tacadas</span>
              <span class="stat-value" id="strokeTotal">0</span>
            </div>
          </div>

          <div class="green" id="green" role="group" aria-label="Campo de golfe">
            <div class="turf" id="turf"></div>
            <div class="cup" id="cup"></div>
            <div class="ball" id="ball"></div>
            <div class="puzzle-preview" id="preview" aria-hidden="true"></div>
          </div>

          <div class="scorecard" id="scorecard" role="img" aria-label="Cartão de pontuação"></div>

          <div class="pad">
            <button class="pad-button" id="leftButton" type="button" aria-label="Bater para a esquerda">◀</button>
            <button class="pad-button" id="upButton" type="button" aria-label="Bater para cima">▲</button>
            <button class="pad-button" id="downButton" type="button" aria-label="Bater para baixo">▼</button>
            <button class="pad-button" id="rightButton" type="button" aria-label="Bater para a direita">▶</button>
          </div>

          <div class="controls">
            <button class="control-button secondary" id="previewButton" type="button" aria-pressed="false">Ver fotografia</button>
          </div>

          <div class="footnote">
            <p class="hint"><span class="hint-icon" aria-hidden="true">⛳</span>A bola desliza até bater em alguma coisa — a relva levanta por onde ela passa.</p>
            <button class="restart" id="restartButton" type="button">Recomeçar</button>
          </div>
          <p class="sr-only" id="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <div class="celebration" id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" aria-hidden="true">
      <div class="celebration-card">
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <i class="burst" aria-hidden="true"></i>
        <span class="celebration-photo" role="img" aria-label="Fotografia do Manuel, já inteira"></span>
        <span class="celebration-emoji" aria-hidden="true">🎂</span>
        <h2 id="celebrationTitle">Um dia especial</h2>
        <p id="celebrationText">Muitos parabéns, Manuel!</p>
        <button class="celebration-button" id="playAgainButton" type="button">Jogar outra vez</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        // Tudo o que muda de puzzle para puzzle vive aqui.
        const PUZZLE = {
          name: "Manuel",
          wish: "Que este novo ano te dê sempre a linha certa — e que a bola caia sempre à primeira.",
        };

        /*
         * Cada buraco é um tabuleiro de 6 × 6 escrito casa a casa: `.` é relva,
         * `T` uma árvore, `S` areia, `~` água, `O` o copo e `B` o sítio de onde
         * a bola parte.
         *
         * A regra é uma só: a bola desliza até bater em alguma coisa e nunca
         * pára a meio do caminho. É por isso que as árvores valem tanto — são
         * elas que dizem onde a bola pode ficar. A areia agarra-a à primeira
         * casa, a água manda-a para trás, e o copo apanha-a de passagem.
         *
         * Nenhum destes tabuleiros tem beco: de qualquer casa onde a bola pare,
         * o copo continua a poder ser alcançado.
         */
        const SIZE = 6;
        const HOLES = [
          { name: "O primeiro", grid: ["......", "......", "...O..", "......", "......", "B...T."] },
          { name: "A areia",    grid: [".S....", "...S..", "B.T...", "....T.", "..O...", "...T.."] },
          { name: "O lago",     grid: ["......", "TT.O..", "..~...", "B.....", "..T...", "....TT"] },
          { name: "As árvores", grid: ["..TT..", "..O...", "......", "BT....", "..T...", "....T."] },
          { name: "O desvio",   grid: ["..~...", "..T...", "...O..", "....~T", "S.T...", "TB...."] },
          { name: "A ilha",     grid: [".S..T.", ".~~O.T", "...S..", ".T.TT.", "....~.", "..B..."] },
          { name: "O bosque",   grid: ["..TTO.", "......", ".~..~.", "....TS", ".....T", ".B.TT."] },
          { name: "A margem",   grid: ["TBS...", "~....T", "......", "O..S..", "~.....", ".T~..."] },
          { name: "O último",   grid: [".T...B", "......", "..S..T", "......", "S.....", ".OT..."] },
        ];

        const WAYS = {
          up: { step: [0, -1], name: "para cima" },
          down: { step: [0, 1], name: "para baixo" },
          left: { step: [-1, 0], name: "para a esquerda" },
          right: { step: [1, 0], name: "para a direita" },
        };

        const ROLL_MS = 70;        // o tempo que a bola leva de casa em casa
        const HOLE_PAUSE = 800;    // o compasso de espera depois de a bola cair
        const PARTY_DELAY = 2200;  // e o de ver a fotografia inteira antes da festa
        const CELL = 100 / SIZE;   // quanto mede uma casa, em percentagem do campo
        const middle = (n) => (n + 0.5) * CELL;

        /*
         * Onde é que a bola pára se sair desta casa para este lado. Devolve o
         * caminho casa a casa — é ele que se vê a desenrolar no ecrã, e é ele
         * que levanta a relva por onde passa.
         */
        function slide(cells, from, [dx, dy]) {
          let { x, y } = from;
          const path = [];
          for (;;) {
            const nx = x + dx;
            const ny = y + dy;
            if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) break;
            const mark = cells[ny][nx];
            if (mark === "T") break;
            path.push({ x: nx, y: ny });
            if (mark === "~") return { path, outcome: "water" };
            if (mark === "O") return { path, outcome: "sunk" };
            x = nx;
            y = ny;
            if (mark === "S") return { path, outcome: "sand" };
          }
          return { path, outcome: path.length ? "rest" : "blocked" };
        }

        /*
         * O par não está escrito em lado nenhum: a página resolve o buraco à
         * largura e o par é o caminho mais curto que encontrar.
         */
        function shortest(cells, tee) {
          const seen = new Set([`${tee.x},${tee.y}`]);
          let edge = [tee];
          for (let moves = 1; edge.length; moves += 1) {
            const next = [];
            for (const spot of edge) {
              for (const way of Object.values(WAYS)) {
                const { path, outcome } = slide(cells, spot, way.step);
                if (outcome === "sunk") return moves;
                if (outcome !== "rest" && outcome !== "sand") continue;
                const stop = path[path.length - 1];
                const key = `${stop.x},${stop.y}`;
                if (seen.has(key)) continue;
                seen.add(key);
                next.push(stop);
              }
            }
            edge = next;
          }
          return null;
        }

        /** Lê o tabuleiro escrito à mão e tira de lá a bola, o copo e o par. */
        function readHole(hole) {
          const cells = hole.grid.map((row) => [...row]);
          let tee = null;
          let cup = null;
          cells.forEach((row, y) => row.forEach((mark, x) => {
            if (mark === "B") { tee = { x, y }; row[x] = "."; }
            if (mark === "O") cup = { x, y };
          }));
          return { name: hole.name, cells, tee, cup, par: shortest(cells, tee) };
        }

        const COURSE = HOLES.map(readHole);
        const totalPar = COURSE.reduce((sum, item) => sum + item.par, 0);

        const green = document.querySelector("#green");
        const turf = document.querySelector("#turf");
        const cupMark = document.querySelector("#cup");
        const ballMark = document.querySelector("#ball");
        const scorecard = document.querySelector("#scorecard");
        const holeNumber = document.querySelector("#holeNumber");
        const holeGoal = document.querySelector("#holeGoal");
        const holeBadge = document.querySelector("#holeBadge");
        const strokeTotal = document.querySelector("#strokeTotal");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const previewButton = document.querySelector("#previewButton");
        const restartButton = document.querySelector("#restartButton");
        const upButton = document.querySelector("#upButton");
        const downButton = document.querySelector("#downButton");
        const leftButton = document.querySelector("#leftButton");
        const rightButton = document.querySelector("#rightButton");
        const celebration = document.querySelector("#celebration");
        const celebrationText = document.querySelector("#celebrationText");
        const playAgainButton = document.querySelector("#playAgainButton");

        const tiles = [];
        const boxes = [];

        let hole = 0;          // o buraco que se está a jogar
        let ball = { x: 0, y: 0 };
        let shotFrom = { x: 0, y: 0 };
        let strokes = 0;       // as tacadas neste buraco
        let card = [];         // as tacadas dos buracos já fechados
        let opened = 0;        // quantas casas da fotografia já estão destapadas
        let busy = false;      // a bola a deslizar, ou o buraco a mudar
        let solved = false;
        let rollId = null;

        const current = () => COURSE[hole];
        const totalStrokes = () => card.reduce((sum, value) => sum + value, 0) + strokes;

        function announce(message) {
          status.textContent = "";
          window.setTimeout(() => { status.textContent = message; }, 20);
        }

        /** O nome que o golfe dá ao resultado de um buraco. */
        function termFor(count, par) {
          if (count === 1) return "hole-in-one";
          const over = count - par;
          if (over <= -2) return "eagle";
          if (over === -1) return "birdie";
          if (over === 0) return "par";
          if (over === 1) return "bogey";
          if (over === 2) return "duplo bogey";
          return `${over} acima do par`;
        }

        /** E o nome que dá ao total da volta. */
        function roundTerm(count) {
          const over = count - totalPar;
          if (over === 0) return "tudo no par";
          if (over < 0) return `${-over} abaixo do par`;
          return `${over} acima do par`;
        }

        function drawCourse() {
          const { cells, cup, name, par } = current();

          green.querySelectorAll(".hazard").forEach((element) => element.remove());
          cells.forEach((row, y) => row.forEach((mark, x) => {
            const kind = mark === "T" ? "tree" : mark === "S" ? "sand" : mark === "~" ? "water" : null;
            if (!kind) return;
            const element = document.createElement("div");
            element.className = "hazard";
            element.dataset.kind = kind;
            element.dataset.cell = `${x},${y}`;
            element.style.left = `${x * CELL}%`;
            element.style.top = `${y * CELL}%`;
            green.insertBefore(element, cupMark);
          }));

          cupMark.style.left = `${middle(cup.x)}%`;
          cupMark.style.top = `${middle(cup.y)}%`;
          green.dataset.cup = `${cup.x},${cup.y}`;
          green.dataset.hole = String(hole + 1);
          green.dataset.par = String(par);
          holeNumber.textContent = String(hole + 1);
          holeGoal.textContent = `/${COURSE.length}`;
          holeBadge.textContent = `${name} · par ${par}`;
        }

        function drawBall() {
          ballMark.style.left = `${middle(ball.x)}%`;
          ballMark.style.top = `${middle(ball.y)}%`;
          green.dataset.ball = `${ball.x},${ball.y}`;
        }

        function drawScorecard() {
          boxes.forEach((box, index) => {
            const played = index < card.length;
            const strokesHere = played ? card[index] : index === hole ? strokes : null;
            box.querySelector(".score-strokes").textContent =
              strokesHere === null || strokesHere === 0 ? "–" : String(strokesHere);
            if (played) {
              const over = card[index] - COURSE[index].par;
              box.dataset.result = over < 0 ? "under" : over === 0 ? "par" : "over";
            } else if (index === hole && !solved) {
              box.dataset.result = "playing";
            } else {
              delete box.dataset.result;
            }
          });
          strokeTotal.textContent = String(totalStrokes());
          green.dataset.strokes = String(strokes);
          green.dataset.total = String(totalStrokes());
        }

        function setBusy(value) {
          busy = value;
          green.dataset.busy = value ? "1" : "";
          [upButton, downButton, leftButton, rightButton].forEach((button) => {
            button.disabled = value || solved;
          });
        }

        /** Uma tacada: a bola sai para um lado e vai até onde puder. */
        function play(direction) {
          if (busy || solved) return;
          const { path, outcome } = slide(current().cells, ball, WAYS[direction].step);
          if (outcome === "blocked") {
            // Bater contra o que está encostado não é tacada nenhuma.
            announce(`A bola não tem para onde ir ${WAYS[direction].name}.`);
            return;
          }
          shotFrom = { ...ball };
          strokes += 1;
          drawScorecard();
          setBusy(true);
          walk(path, outcome);
        }

        /** A bola percorre no ecrã o caminho que a tacada já deu. */
        function walk(path, outcome) {
          let index = 0;
          window.clearInterval(rollId);
          rollId = window.setInterval(() => {
            if (index >= path.length) {
              window.clearInterval(rollId);
              rollId = null;
              finishShot(outcome);
              return;
            }
            ball = path[index];
            index += 1;
            drawBall();
            openTile(ball.x, ball.y);
          }, ROLL_MS);
        }

        function finishShot(outcome) {
          if (outcome === "water") {
            // A água custa uma tacada e a bola volta ao sítio de onde saiu.
            strokes += 1;
            ball = { ...shotFrom };
            drawBall();
            drawScorecard();
            announce("A bola foi à água. Mais uma tacada, e volta ao sítio.");
            setBusy(false);
            return;
          }

          if (outcome !== "sunk") {
            announce(outcome === "sand"
              ? `A areia parou a bola. Tacada ${strokes}.`
              : `Tacada ${strokes}. A bola parou no relvado.`);
            setBusy(false);
            return;
          }

          const { par } = current();
          // As tacadas passam para o cartão e a conta deste buraco fecha aqui.
          const played = strokes;
          card.push(played);
          strokes = 0;
          drawScorecard();
          announce(`${termFor(played, par)}! O buraco ${hole + 1} está fechado.`);
          playChime(played <= par);

          window.setTimeout(() => {
            if (hole === COURSE.length - 1) {
              completeGame();
              return;
            }
            hole += 1;
            startHole();
            setBusy(false);
          }, HOLE_PAUSE);
        }

        /** A relva de uma casa levanta-se assim que a bola lhe passa por cima. */
        function openTile(x, y) {
          const tile = tiles[y * SIZE + x];
          if (!tile || tile.dataset.state === "open") return;
          tile.dataset.state = "open";
          opened += 1;
          green.dataset.opened = String(opened);
        }

        function startHole() {
          ball = { ...current().tee };
          shotFrom = { ...ball };
          drawCourse();
          drawBall();
          drawScorecard();
          // A relva por baixo da bola também conta: é a casa de onde ela parte.
          openTile(ball.x, ball.y);
        }

        function completeGame() {
          solved = true;
          // Fechada a volta, levanta-se o que sobrou da relva.
          tiles.forEach((tile, index) => openTile(index % SIZE, Math.floor(index / SIZE)));
          turf.classList.add("solved");
          green.dataset.solved = "1";
          setBusy(false);
          const total = totalStrokes();
          celebrationText.textContent = `Fechaste os nove buracos em ${total} tacadas — ${roundTerm(total)} — e a fotografia ficou inteira. Muitos parabéns, ${PUZZLE.name}! ${PUZZLE.wish}`;
          announce("Fotografia inteira. Parabéns!");
          // Um compasso de espera para se ver o campo já todo fotografia.
          window.setTimeout(() => {
            celebration.classList.add("visible");
            celebration.setAttribute("aria-hidden", "false");
            playAgainButton.focus();
          }, PARTY_DELAY);
          playChime(true);
        }

        function hideCelebration() {
          celebration.classList.remove("visible");
          celebration.setAttribute("aria-hidden", "true");
        }

        function setPreview(visible) {
          preview.classList.toggle("visible", visible);
          previewButton.setAttribute("aria-pressed", String(visible));
          previewButton.textContent = visible ? "Voltar ao jogo" : "Ver fotografia";
        }

        function restart() {
          hideCelebration();
          window.clearInterval(rollId);
          rollId = null;
          hole = 0;
          strokes = 0;
          card = [];
          opened = 0;
          solved = false;
          turf.classList.remove("solved");
          delete green.dataset.solved;
          green.dataset.opened = "0";
          tiles.forEach((tile) => { tile.dataset.state = "grass"; });
          setPreview(false);
          startHole();
          setBusy(false);
          announce("Campo outra vez fechado. Boa sorte!");
        }

        function playChime(happy) {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audio = new AudioContext();
            const notes = happy ? [523.25, 659.25, 783.99] : [523.25, 587.33];
            notes.forEach((frequency, index) => {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, audio.currentTime + index * 0.12);
              gain.gain.linearRampToValueAtTime(0.12, audio.currentTime + index * 0.12 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + index * 0.12 + 0.4);
              oscillator.connect(gain).connect(audio.destination);
              oscillator.start(audio.currentTime + index * 0.12);
              oscillator.stop(audio.currentTime + index * 0.12 + 0.42);
            });
            window.setTimeout(() => audio.close(), 900);
          } catch (_) {
            // O som é um extra; o jogo joga-se todo sem ele.
          }
        }

        function build() {
          // O tabuleiro e a fotografia são a mesma grelha: 36 casas.
          for (let index = 0; index < SIZE * SIZE; index += 1) {
            const row = Math.floor(index / SIZE);
            const column = index % SIZE;
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.dataset.state = "grass";
            tile.style.backgroundImage = 'url("./assets/photo.jpg")';
            tile.style.backgroundRepeat = "no-repeat";
            tile.style.backgroundSize = `${SIZE * 100}% ${SIZE * 100}%`;
            tile.style.backgroundPosition = `${(column * 100) / (SIZE - 1)}% ${(row * 100) / (SIZE - 1)}%`;
            tiles.push(tile);
            turf.appendChild(tile);
          }

          COURSE.forEach((item, index) => {
            const box = document.createElement("div");
            box.className = "score-box";
            box.innerHTML = `<span class="score-hole">${index + 1}</span><span class="score-strokes">–</span>`;
            boxes.push(box);
            scorecard.appendChild(box);
          });
          scorecard.setAttribute("aria-label", `Cartão de pontuação, par ${totalPar}`);
        }

        upButton.addEventListener("click", () => play("up"));
        downButton.addEventListener("click", () => play("down"));
        leftButton.addEventListener("click", () => play("left"));
        rightButton.addEventListener("click", () => play("right"));
        restartButton.addEventListener("click", restart);
        previewButton.addEventListener("click", () => setPreview(!preview.classList.contains("visible")));
        playAgainButton.addEventListener("click", () => {
          restart();
          upButton.focus();
        });
        celebration.addEventListener("click", (event) => {
          if (event.target === celebration) hideCelebration();
        });

        document.addEventListener("keydown", (event) => {
          const keys = {
            ArrowUp: () => play("up"),
            ArrowDown: () => play("down"),
            ArrowLeft: () => play("left"),
            ArrowRight: () => play("right"),
            Escape: () => { setPreview(false); hideCelebration(); },
          };
          const action = keys[event.key];
          if (!action) return;
          event.preventDefault();
          action();
        });

        /*
         * No telemóvel joga-se com o dedo por cima do campo: arrasta-se para o
         * lado para onde se quer mandar a bola.
         */
        let drag = null;

        green.addEventListener("pointerdown", (event) => {
          if (busy || solved) return;
          drag = { x: event.clientX, y: event.clientY };
          green.setPointerCapture?.(event.pointerId);
        });

        green.addEventListener("pointerup", (event) => {
          if (!drag) return;
          const dx = event.clientX - drag.x;
          const dy = event.clientY - drag.y;
          drag = null;
          green.releasePointerCapture?.(event.pointerId);
          // Um toque parado não é tacada: só conta quem arrasta mesmo.
          if (Math.hypot(dx, dy) < 18) return;
          if (Math.abs(dx) > Math.abs(dy)) play(dx > 0 ? "right" : "left");
          else play(dy > 0 ? "down" : "up");
        });

        green.addEventListener("pointercancel", () => { drag = null; });

        build();
        restart();
      })();
    </script>
  </body>
</html>
